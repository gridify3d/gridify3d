function renderBracket(){
  const canvas=document.getElementById('bracketCanvas');
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;

  // ── Layout constants ─────────────────────────────────────────
  const MW=130, MH=46, MG=8;   // KO match: width, height, gap
  const RG=44;                   // gap between KO rounds
  const GW=96;                   // group block width
  const GH=62;                   // group block height (header+3 rows)
  const GG=220;                  // gap — 36 slots × 6px each, fully separated
  const ROUNDS=['r32','r16','qf','sf','final'];
  const PAD={top:40,left:8,right:12,bottom:20};

  // Total height: 16 R32 slots
  const totalH=16*(MH+MG)-MG;

  // X positions: group column at left, then KO rounds
  const grpColX=PAD.left;
  function roundX(ri){ return PAD.left + GW + GG + ri*(MW+RG); }

  const totalW=GW+GG+5*MW+4*RG;
  const W=totalW+PAD.left+PAD.right;
  const H=totalH+PAD.top+PAD.bottom;

  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Background
  ctx.fillStyle='#f5f5f7';
  ctx.fillRect(0,0,W,H);

  // ── Helpers ──────────────────────────────────────────────────
  function truncateText(txt, maxW){
    let out=txt||'';
    while(ctx.measureText(out).width>maxW&&out.length>3) out=out.slice(0,-1);
    return out.length<(txt||'').length?out.slice(0,-1)+'…':out;
  }

  function drawCanvasTeam(team, x, y, maxW, bold, color){
    const flagSize=11, gap=4;
    const img=getCanvasFlagImage(team.flag);
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.drawImage(img,x,y-flagSize+2,flagSize,flagSize);
    } else {
      ctx.fillStyle='#1e2d4a'; roundRect(ctx,x,y-flagSize+2,flagSize,flagSize,2); ctx.fill();
    }
    ctx.font=`${bold?'bold ':''}9px "Segoe UI",sans-serif`;
    ctx.fillStyle=color;
    ctx.fillText(truncateText(team.name, maxW-flagSize-gap), x+flagSize+gap, y);
  }

  // Y centre of match[mi] in a given round index ri
  function matchY(ri,mi){
    const N=16/Math.pow(2,ri);
    const slotH=totalH/N;
    return PAD.top+mi*slotH+(slotH-MH)/2;
  }
  function matchCY(ri,mi){ return matchY(ri,mi)+MH/2; }

  // ── KO match order ───────────────────────────────────────────
  const matchOrder={
    r32:['r32_1','r32_2','r32_3','r32_4','r32_5','r32_6','r32_7','r32_8',
         'r32_9','r32_10','r32_11','r32_12','r32_13','r32_14','r32_15','r32_16'],
    r16:['r16_1','r16_2','r16_3','r16_4','r16_5','r16_6','r16_7','r16_8'],
    qf: ['qf_1','qf_2','qf_3','qf_4'],
    sf: ['sf_1','sf_2'],
    final:['final_1'],
  };

  // ── Round headers ────────────────────────────────────────────
  const rLabels={r32:'16tel-Finale',r16:'Achtelfinale',qf:'Viertelfinale',sf:'Halbfinale',final:'Finale'};
  ROUNDS.forEach((rnd,ri)=>{
    ctx.font='bold 9px "Segoe UI",sans-serif';
    ctx.textAlign='center'; ctx.fillStyle='#1c6ef3';
    ctx.fillText(rLabels[rnd], roundX(ri)+MW/2, PAD.top-8);
  });
  // Group column header
  ctx.font='bold 9px "Segoe UI",sans-serif';
  ctx.textAlign='center'; ctx.fillStyle='#1c6ef3';
  ctx.fillText('Gruppen', grpColX+GW/2, PAD.top-8);

  // ── KO connector lines (R32→R16→…) ──────────────────────────
  ctx.strokeStyle='#b0b8c8'; ctx.lineWidth=1.5;
  ROUNDS.forEach((rnd,ri)=>{
    if(ri===0) return;
    const N=16/Math.pow(2,ri);
    for(let mi=0;mi<N;mi++){
      const y1=matchCY(ri-1,mi*2), y2=matchCY(ri-1,mi*2+1);
      const yMid=(y1+y2)/2;
      const xPrev=roundX(ri-1)+MW, xCurr=roundX(ri);
      ctx.beginPath();ctx.moveTo(xPrev,y1);ctx.lineTo(xPrev+RG/2,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(xPrev,y2);ctx.lineTo(xPrev+RG/2,y2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(xPrev+RG/2,y1);ctx.lineTo(xPrev+RG/2,y2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(xPrev+RG/2,yMid);ctx.lineTo(xCurr,yMid);ctx.stroke();
    }
  });

  // ── Build group → R32 slot mapping ──────────────────────────
  // For each R32 match, store which Y-row (slotA=top, slotB=bottom) each group+pos feeds
  // grpSlotMap[groupName][pos] = {r32MatchIndex, isSlotA}
  const r32list=matchOrder.r32;
  const grpSlotMap={}; // 'A' → [{r32mi, isSlotA, pos}]
  r32list.forEach((mid,r32mi)=>{
    const m=KO_BRACKET.find(x=>x.id===mid);
    if(!m) return;
    [m.slotA, m.slotB].forEach((slot,si)=>{
      if(slot.src==='grp'){
        if(!grpSlotMap[slot.g]) grpSlotMap[slot.g]=[];
        grpSlotMap[slot.g].push({r32mi, isSlotA:si===0, pos:slot.pos});
      } else if(slot.src==='grp3'){
        const assignments = bracketLockedOnly ? getThirdAssignmentsLocked() : getThirdAssignments();
        const si2 = si;
        const teamId = assignments.get(m.id+'_'+si2);
        if(teamId!=null){
          const gi=GN.findIndex((_,i)=>{
            const tb=bracketLockedOnly?calcTableLocked(i):calcTable(i);
            return tb[2]?.id===teamId;
          });
          if(gi>=0){
            const g=GN[gi];
            if(!grpSlotMap[g]) grpSlotMap[g]=[];
            grpSlotMap[g].push({r32mi, isSlotA:si===0, pos:3});
          }
        }
      }
    });
  });

  // ── Distribute 12 group blocks evenly over totalH ───────────
  const grpSliceH = totalH/12;
  function grpBoxY(gi){ return PAD.top + gi*grpSliceH + (grpSliceH-GH)/2; }

  // Row heights inside group block
  const GHdr=14;
  const GRow=14;

  // One color per group — used for block border, header, and connector lines
  const GROUP_COLORS = [
    '#f5a623', // A — orange
    '#4fc3f7', // B — sky blue
    '#81c784', // C — green
    '#e57373', // D — red
    '#ba68c8', // E — purple
    '#4dd0e1', // F — cyan
    '#ffb74d', // G — amber
    '#a5d6a7', // H — light green
    '#f48fb1', // I — pink
    '#90caf9', // J — light blue
    '#fff176', // K — yellow
    '#80cbc4', // L — teal
  ];
  const POS_ALPHA = [1.0, 0.65, 0.4];
  const POS_WIDTH = [2.0, 1.5, 1.2];

  // ── Draw group blocks ────────────────────────────────────────
  GN.forEach((g,gi)=>{
    const bx=grpColX, by=grpBoxY(gi);
    const gc=GROUP_COLORS[gi];
    const gr=parseInt(gc.slice(1,3),16);
    const gg=parseInt(gc.slice(3,5),16);
    const gb=parseInt(gc.slice(5,7),16);

    // Box background + colored border
    ctx.fillStyle='#ffffff';
    ctx.strokeStyle=`rgba(${gr},${gg},${gb},0.6)`;
    ctx.lineWidth=1.5;
    roundRect(ctx,bx,by,GW,GH,4); ctx.fill(); ctx.stroke();

    // Left accent bar in group color
    ctx.fillStyle=gc;
    roundRect(ctx,bx,by,3,GH,{tl:4,bl:4,tr:0,br:0}); ctx.fill();

    // Header "Gruppe X"
    ctx.font='bold 8px "Segoe UI",sans-serif';
    ctx.fillStyle=gc; ctx.textAlign='left';
    ctx.fillText(`Gruppe ${g}`, bx+7, by+10);

    // Divider under header
    ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(bx+4,by+GHdr); ctx.lineTo(bx+GW-4,by+GHdr); ctx.stroke();

    // 3 team rows
    const tb=bracketLockedOnly?calcTableLocked(gi):calcTable(gi);
    for(let pos=1;pos<=3;pos++){
      const team=tb[pos-1]?TEAMS[tb[pos-1].id]:null;
      const rowY=by+GHdr+(pos-1)*GRow;
      const textY=rowY+GRow-4;

      // Position badge
      ctx.font='bold 7px "Segoe UI",sans-serif';
      ctx.fillStyle=`rgba(${gr},${gg},${gb},${POS_ALPHA[pos-1]})`; ctx.textAlign='left';
      ctx.fillText(`${pos}.`, bx+6, textY);

      if(team){
        const img=getCanvasFlagImage(team.flag);
        if(img&&img.complete&&img.naturalWidth>0){
          ctx.drawImage(img,bx+16,textY-9,10,10);
        }
        ctx.font='8px "Segoe UI",sans-serif';
        ctx.fillStyle=pos===1?'#1d1d1f':pos===2?'#515154':'#8e8e93'; ctx.textAlign='left';
        ctx.fillText(truncateText(team.name, GW-34), bx+28, textY);
      } else {
        ctx.font='italic 7px "Segoe UI",sans-serif';
        ctx.fillStyle='#8e8e93'; ctx.textAlign='left';
        ctx.fillText('?', bx+16, textY);
      }
    }
  });

  // ── Highlight selected group box ────────────────────────────
  if(selectedBracketGroup !== null){
    const sgi = GN.indexOf(selectedBracketGroup);
    if(sgi>=0){
      const bx=grpColX, by=grpBoxY(sgi);
      const gc=GROUP_COLORS[sgi];
      const gr=parseInt(gc.slice(1,3),16);
      const gg2=parseInt(gc.slice(3,5),16);
      const gb=parseInt(gc.slice(5,7),16);
      // Outer glow
      ctx.strokeStyle=`rgba(${gr},${gg2},${gb},0.35)`;
      ctx.lineWidth=6;
      roundRect(ctx,bx-3,by-3,GW+6,GH+6,6); ctx.stroke();
      // Solid border
      ctx.strokeStyle=`rgba(${gr},${gg2},${gb},1.0)`;
      ctx.lineWidth=2.5;
      roundRect(ctx,bx,by,GW,GH,4); ctx.stroke();
    }
  }

  // ── Draw group→R32 connector lines ──────────────────────────
  // Each group has its own color; position 1=bright, 2=medium, 3=dim.
  // 12 groups × 3 positions = 36 unique X slots across the gap.

  const slotW  = GG / 37;
  const gapX0  = grpColX + GW;

  const hasSelection = selectedBracketGroup !== null;

  // Draw non-selected groups first (dimmed), selected group last (on top)
  const drawOrder = hasSelection
    ? [...GN.keys()].filter(gi=>GN[gi]!==selectedBracketGroup).concat([...GN.keys()].filter(gi=>GN[gi]===selectedBracketGroup))
    : [...GN.keys()];

  drawOrder.forEach(gi=>{
    const g = GN[gi];
    const slots = grpSlotMap[g] || [];
    if(bracketLockedOnly && !groupHasAnyLocked(gi)) return;
    const by    = grpBoxY(gi);
    const baseColor = GROUP_COLORS[gi];

    const r  = parseInt(baseColor.slice(1,3),16);
    const rb = parseInt(baseColor.slice(3,5),16);
    const b  = parseInt(baseColor.slice(5,7),16);

    const isSelected = hasSelection && g === selectedBracketGroup;
    const isDimmed   = hasSelection && !isSelected;

    slots.forEach(({r32mi, isSlotA, pos})=>{
      const rowY     = by + GHdr + (pos-1)*GRow + GRow/2;
      const startX   = gapX0;
      const slotIdx  = gi * 3 + (pos - 1);
      const vx       = gapX0 + (slotIdx + 0.5) * slotW;

      const r32y     = matchY(0, r32mi);
      const r32LineY = isSlotA ? r32y + MH*0.27 : r32y + MH*0.73;
      const r32LineX = roundX(0);

      const baseAlpha = POS_ALPHA[pos-1];
      // Highlight colors: gold / silver / bronze
      const HIGHLIGHT_COLORS = ['#d4a017','#8a9bb0','#a0522d'];
      const hlColor = HIGHLIGHT_COLORS[pos-1];

      const alpha  = isDimmed ? 0.07 : baseAlpha;
      const lw     = isSelected ? 3.5 - (pos-1)*0.5 : POS_WIDTH[pos-1];
      const dotR   = isSelected ? 4.5 : 2.5;
      const lineColor = isSelected ? hlColor : `rgba(${r},${rb},${b},${alpha})`;

      // Halo for selected group
      if(isSelected){
        ctx.strokeStyle = `rgba(255,255,255,0.85)`;
        ctx.lineWidth   = lw + 5;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(startX, rowY); ctx.lineTo(vx, rowY);
        ctx.lineTo(vx, r32LineY); ctx.lineTo(r32LineX, r32LineY);
        ctx.stroke();
      }

      ctx.strokeStyle = lineColor;
      ctx.lineWidth   = lw;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(startX,   rowY);
      ctx.lineTo(vx,       rowY);
      ctx.lineTo(vx,       r32LineY);
      ctx.lineTo(r32LineX, r32LineY);
      ctx.stroke();

      ctx.fillStyle = lineColor;
      ctx.beginPath(); ctx.arc(startX,   rowY,     dotR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r32LineX, r32LineY, dotR, 0, Math.PI*2); ctx.fill();
    });
  });

  // ── Draw R32–final KO matches ────────────────────────────────
  const clickZones=[];

  ROUNDS.forEach((rnd,ri)=>{
    const ids=matchOrder[rnd];
    ids.forEach((mid,mi)=>{
      const m=KO_BRACKET.find(x=>x.id===mid);
      if(!m) return;
      const x=roundX(ri), y=matchY(ri,mi);

      const kr=koResults[mid];
      const isLocked=kr&&kr.locked;
      const pred=koPredictions[mid];

      let tAid=null,tBid=null;
      if(bracketLockedOnly){
        tAid=resolveSlotLocked(m.slotA); tBid=resolveSlotLocked(m.slotB);
      } else {
        if(isLocked){ tAid=resolveSlot(m.slotA); tBid=resolveSlot(m.slotB); }
        if(tAid===null&&pred) tAid=pred.teamA;
        if(tBid===null&&pred) tBid=pred.teamB;
      }
      const tA=tAid!==null?TEAMS[tAid]:null;
      const tB=tBid!==null?TEAMS[tBid]:null;
      const hasPred=!!pred&&!bracketLockedOnly;

      let scoreStr='',scoreColor='#5d6a85';
      if(isLocked){ scoreStr=`${kr.goalsA}:${kr.goalsB}${kr.pens?' n.E.':''}`; scoreColor='#27ae60'; }
      else if(hasPred){ scoreStr=`${pred.goalsA}:${pred.goalsB}`; }

      let winnerA=false,winnerB=false;
      if(isLocked){
        const gA=parseInt(kr.goalsA),gB=parseInt(kr.goalsB);
        if(gA>gB||(gA===gB&&kr.pens==='A')) winnerA=true; else winnerB=true;
      } else if(hasPred){
        if(pred.goalsA>pred.goalsB) winnerA=true; else winnerB=true;
      }

      const bgColor=isLocked?'#f0faf3':'#ffffff';
      const borderColor=isLocked?'#34c759':hasPred?'#d2d2d7':'#e5e5ea';
      const accentColor=isLocked?'#34c759':hasPred?'#1c6ef3':'#e5e5ea';

      ctx.fillStyle=bgColor; ctx.strokeStyle=borderColor; ctx.lineWidth=isLocked?2:1;
      roundRect(ctx,x,y,MW,MH,4); ctx.fill(); ctx.stroke();
      ctx.fillStyle=accentColor;
      roundRect(ctx,x,y,3,MH,{tl:4,bl:4,tr:0,br:0}); ctx.fill();

      ctx.textAlign='left';
      const nameX=x+8, scoreX=x+MW-6;
      const yA=y+15, yB=y+31, yScr=y+MH/2+1;
      const maxNameW=MW-52;

      // In locked-only mode: show plain slot label without predicted team
      function slotLabelBracket(slot){
        if(bracketLockedOnly){
          if(slot.src==='grp') return `${slot.pos}. Gr. ${slot.g}`;
          if(slot.src==='grp3'){ const poolStr=slot.groups.join('/'); return `Bester 3. (${poolStr})`; }
          const km=KO_BRACKET.find(x=>x.id===slot.id);
          const rnd={r32:'R32',r16:'AF',qf:'VF',sf:'HF',final:'F','3p':'3P'}[km?.round]||'?';
          return slot.w?`Sieger ${rnd} ${km?.label||''}`:`Verlierer ${rnd} ${km?.label||''}`;
        }
        return slotLabel(slot);
      }

      if(tA){
        const color=isLocked?(winnerA?'#1d1d1f':'#8e8e93'):(winnerA?'#1d1d1f':'#515154');
        drawCanvasTeam(tA,nameX,yA,maxNameW,isLocked&&winnerA,color);
      } else {
        ctx.font='italic 8px "Segoe UI",sans-serif'; ctx.fillStyle='#8e8e93';
        ctx.fillText(slotLabelBracket(m.slotA),nameX,yA);
      }

      ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x+4,y+MH/2); ctx.lineTo(x+MW-4,y+MH/2); ctx.stroke();

      if(tB){
        const color=isLocked?(winnerB?'#1d1d1f':'#8e8e93'):(winnerB?'#1d1d1f':'#515154');
        drawCanvasTeam(tB,nameX,yB,maxNameW,isLocked&&winnerB,color);
      } else {
        ctx.font='italic 8px "Segoe UI",sans-serif'; ctx.fillStyle='#8e8e93';
        ctx.fillText(slotLabelBracket(m.slotB),nameX,yB);
      }

      if(scoreStr){
        ctx.textAlign='right';
        ctx.font=`bold ${isLocked?'11':'10'}px "Segoe UI",sans-serif`;
        ctx.fillStyle=isLocked?'#34c759':'#8e8e93';
        ctx.fillText(scoreStr,scoreX,yScr);
      }

      clickZones.push({x,y,w:MW,h:MH});
    });
  });

  // Finale trophy
  const fx=roundX(4)+MW/2;
  ctx.textAlign='center'; ctx.font='20px serif';
  ctx.fillText('🏆',fx,PAD.top-24);

  // Group box click zones
  const groupClickZones = GN.map((g,gi)=>({g, x:grpColX, y:grpBoxY(gi), w:GW, h:GH}));

  // Helper: convert CSS mouse coords → canvas logical coords
  function canvasXY(e){
    const rect=canvas.getBoundingClientRect();
    // canvas.style.width/height are set in CSS px = W/H px
    // logical coords go 0..W and 0..H
    const mx=(e.clientX-rect.left) * (W/rect.width);
    const my=(e.clientY-rect.top)  * (H/rect.height);
    return {mx, my};
  }

  // Click handler
  canvas.onclick=(e)=>{
    const {mx,my}=canvasXY(e);

    // Check group boxes first
    for(const z of groupClickZones){
      if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){
        selectedBracketGroup = (selectedBracketGroup===z.g) ? null : z.g;
        renderBracket();
        return;
      }
    }
    // Click anywhere else → clear highlight
    if(selectedBracketGroup!==null){
      selectedBracketGroup=null;
      renderBracket();
      return;
    }
    // Check KO match boxes
    for(const z of clickZones){
      if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){
        activeTab='knockout'; render(); break;
      }
    }
  };

  // Pointer cursor over group boxes
  canvas.onmousemove=(e)=>{
    const {mx,my}=canvasXY(e);
    const overGroup = groupClickZones.some(z=>mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h);
    const overKO    = clickZones.some(z=>mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h);
    canvas.style.cursor = (overGroup||overKO) ? 'pointer' : 'grab';
  };
}

function roundRect(ctx,x,y,w,h,r){
  if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
  ctx.beginPath();
  ctx.moveTo(x+r.tl,y);
  ctx.lineTo(x+w-r.tr,y);ctx.arcTo(x+w,y,x+w,y+r.tr,r.tr);
  ctx.lineTo(x+w,y+h-r.br);ctx.arcTo(x+w,y+h,x+w-r.br,y+h,r.br);
  ctx.lineTo(x+r.bl,y+h);ctx.arcTo(x,y+h,x,y+h-r.bl,r.bl);
  ctx.lineTo(x,y+r.tl);ctx.arcTo(x,y,x+r.tl,y,r.tl);
  ctx.closePath();
}

      if(!results[k]||!results[k].locked){
        const[hi,ai]=MATCH_PAIRS[gi][md][mi];
        const pr=predictMatchExt(tids[hi],tids[ai]);
        results[k]={goalsA:pr.goalsA,goalsB:pr.goalsB,locked:false};
      }
    }
    render();
  };

  const fatpp=document.getElementById('fillAllTopPP');
  if(fatpp)fatpp.onclick=()=>{
    const gi=parseInt(fatpp.dataset.gi),tids=GROUPS[gi];
    for(let md=0;md<3;md++)for(let mi=0;mi<2;mi++){
      const k=`g${gi}_m${md*2+mi}`;
      if(!results[k]||!results[k].locked){
        const[hi,ai]=MATCH_PAIRS[gi][md][mi];
        const tp=topTipExtFn(tids[hi],tids[ai]);
        results[k]={goalsA:tp.goalsA,goalsB:tp.goalsB,locked:false};
      }
    }
    render();
  };

  // Lock all entered
  const la=document.getElementById('lockAll');
  if(la)la.onclick=()=>{
    const gi=parseInt(la.dataset.gi);
    for(let i=0;i<6;i++){
      const k=`g${gi}_m${i}`,r=results[k];
      if(r&&r.goalsA!==''&&r.goalsB!==''&&!r.locked)r.locked=true;
    }
    render();
  };

  // Clear group
  const cg=document.getElementById('clearGrp');
  if(cg)cg.onclick=()=>{
    const gi=parseInt(cg.dataset.gi);
    for(let i=0;i<6;i++)delete results[`g${gi}_m${i}`];
    recalcAllElos();render();
  };

  // Team ratings
  document.querySelectorAll('[data-rating]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const id=parseInt(inp.dataset.rating);
      const field=inp.dataset.field;
      let val=parseFloat(inp.value);
      if(field==='goalRate') val=Math.max(0.85,Math.min(1.18,isNaN(val)?1.0:val));
      else if(field==='balance') val=Math.max(-0.10,Math.min(0.10,isNaN(val)?0.0:val));
      else val=Math.max(0.3,Math.min(2.0,isNaN(val)?1.0:val));
      TEAM_RATINGS[id][field]=val;
      inp.value=val.toFixed(2);
      save();
    });
  });
  const rr=document.getElementById('resetRatings');
  if(rr)rr.onclick=()=>{
    // Defaults wiederherstellen — recalcAllElos wendet dann Auto-Updates neu an
    DEFAULT_RATINGS.forEach((r,i)=>{TEAM_RATINGS[i].goalRate=r.goalRate;TEAM_RATINGS[i].balance=r.balance;});
    recalcAllElos();
    render();
  };

  // Reset elo
  const re=document.getElementById('resetElo');
  if(re)re.onclick=()=>{TEAMS.forEach(t=>{t.base=t.defaultBase;t.elo=t.defaultBase});recalcAllElos();render()};

  // Export
  const ex=document.getElementById('doExport');
  if(ex)ex.onclick=()=>{document.getElementById('exportBox').textContent=genExport()};

  // API Tab bindings
  const ti=document.getElementById('tokenInput');
  const bst=document.getElementById('btnSaveToken');
  const btt=document.getElementById('btnTestToken');
  const bup=document.getElementById('btnUpdate');

  if(btt) btt.onclick=async()=>{
    apiStatus='loading';
    apiStatusMsg='Vercel-Proxy wird geprüft...';
    render();
    try{
      const d=await apiTest();
      const total=(d.resultSet?.count||d.matches?.length||'?');
      apiStatus='ok';
      apiStatusMsg=`✅ Proxy funktioniert! football-data.org antwortet · ${total} WM-Spiel(e) gefunden`;
    }catch(e){
      apiStatus='error';
      apiStatusMsg=`❌ Proxy/API-Fehler: ${e.message}`;
    }
    render();
  };

  if(bup) bup.onclick=()=>apiUpdateResults();

  // Fill all KO predictions
  const fko=document.getElementById('fillKO');
  if(fko) fko.onclick=()=>{
    // Build a working copy that starts with all real locked results
    // This is used as the override for resolveSlot so we can chain rounds
    const tempKR={};
    // Seed with existing locked (manual) results
    Object.keys(koResults).forEach(k=>{
      if(koResults[k]&&koResults[k].locked) tempKR[k]={...koResults[k]};
    });

    const rounds=[
      ['r32_1','r32_2','r32_3','r32_4','r32_5','r32_6','r32_7','r32_8',
       'r32_9','r32_10','r32_11','r32_12','r32_13','r32_14','r32_15','r32_16'],
      ['r16_1','r16_2','r16_3','r16_4','r16_5','r16_6','r16_7','r16_8'],
      ['qf_1','qf_2','qf_3','qf_4'],
      ['sf_1','sf_2'],
      ['3p_1','final_1'],
    ];

    // resolveForFill: like resolveSlot but uses tempKR and doesn't need locked flag
    // directly reads score from tempKR to find winner
    function resolveForFill(slot){
      if(slot.src==='grp'){
        const gi=GN.indexOf(slot.g);
        const tb=calcTable(gi);
        return tb[slot.pos-1]?.id ?? null;
      }
      // src='ko': look in tempKR
      const kr=tempKR[slot.id];
      if(!kr) return null; // not yet computed this fill session
      const m=KO_BRACKET.find(x=>x.id===slot.id);
      if(!m) return null;
      const tA=resolveForFill(m.slotA), tB=resolveForFill(m.slotB);
      if(tA===null||tB===null) return null;
      const gA=kr.goalsA, gB=kr.goalsB;
      if(slot.w){
        if(gA>gB) return tA;
        if(gB>gA) return tB;
        if(kr.pens==='A') return tA;
        if(kr.pens==='B') return tB;
        return tA; // fallback: slot A wins
      } else {
        if(gA>gB) return tB;
        if(gB>gA) return tA;
        return tB; // fallback
      }
    }

    for(const roundMatches of rounds){
      for(const mid of roundMatches){
        // Skip manually locked real results
        if(koResults[mid]&&koResults[mid].locked) continue;
        const m=KO_BRACKET.find(x=>x.id===mid);
        if(!m) continue;
        const tAid=resolveForFill(m.slotA);
        const tBid=resolveForFill(m.slotB);
        if(tAid===null||tBid===null) continue;
        const pr=predictMatchExt(tAid,tBid);
        let gA=pr.goalsA, gB=pr.goalsB;
        if(gA===gB){ if(pr.pW>=pr.pL) gA++; else gB++; }
        tempKR[mid]={goalsA:gA,goalsB:gB,pens:null,autoFilled:true};
      }
    }

    // Write auto-filled results into koResults as UNLOCKED predictions
    // (real locked results keep their locked:true)
    Object.keys(tempKR).forEach(mid=>{
      if(tempKR[mid].autoFilled){
        koResults[mid]={
          goalsA:tempKR[mid].goalsA,
          goalsB:tempKR[mid].goalsB,
          locked:false,
          pens:null
        };
      }
    });

    saveKO(); render();
  };

  const cko=document.getElementById('clearKO');
  if(cko) cko.onclick=()=>{
    if(confirm('Alle KO-Tipps löschen?')){ koResults={}; saveKO(); render(); }
  };

  // ── KO score inputs ──────────────────────────────────────────
  document.querySelectorAll('input[data-ko][data-side]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const id=inp.dataset.ko, side=inp.dataset.side;
      if(!koResults[id]) koResults[id]={goalsA:'',goalsB:'',locked:false,pens:null};
      const v=inp.value===''?'':parseInt(inp.value);
      if(side==='A') koResults[id].goalsA=isNaN(v)?'':v;
      else           koResults[id].goalsB=isNaN(v)?'':v;
      // Update lock button without full re-render
      const card=inp.closest('.ko-card');
      const lockBtn=card?card.querySelector('.btn-lock.lock[data-ko]'):null;
      if(lockBtn){
        const kr=koResults[id];
        lockBtn.disabled=!(kr.goalsA!==''&&kr.goalsB!=='');
      }
      saveKO();
      // Only re-render when both fields are filled or both cleared
      const kr=koResults[id];
      const bothFilled=kr.goalsA!==''&&kr.goalsB!=='';
      const bothEmpty=kr.goalsA===''&&kr.goalsB==='';
      if(bothFilled||bothEmpty) renderWithFocus();
    });
  });

  // ── KO lock buttons ──────────────────────────────────────────
  document.querySelectorAll('.btn-lock.lock[data-ko]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.ko;
      const kr=koResults[id];
      if(!kr||kr.goalsA===''||kr.goalsB==='') return;
      const gA=parseInt(kr.goalsA), gB=parseInt(kr.goalsB);
      if(gA===gB && !kr.pens){
        alert('Unentschieden nach Verlängerung: Bitte zuerst den Elfmeter-Sieger wählen!');
        return;
      }
      koResults[id].locked=true;
      saveKO(); render();
    };
  });

  // ── KO unlock buttons ────────────────────────────────────────
  document.querySelectorAll('.btn-lock.unlock[data-ko]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.ko;
      if(koResults[id]){ koResults[id].locked=false; saveKO(); render(); }
    };
  });

  // ── Penalty winner buttons ───────────────────────────────────
  document.querySelectorAll('.btn-pens[data-ko]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.ko, pens=btn.dataset.pens;
      if(!koResults[id]) koResults[id]={goalsA:'',goalsB:'',locked:false,pens:null};
      koResults[id].pens=pens;
      saveKO(); render();
    };
  });

}

// ============================================================
// INIT
// ============================================================
load();
loadKO();
render();
</script>

<button id="scrollTopBtn" title="Nach oben" aria-label="Nach oben scrollen">&#8679;</button>
<script>
(function(){
  const btn=document.getElementById('scrollTopBtn');
  window.addEventListener('scroll',function(){
    btn.classList.toggle('visible',window.scrollY>200);
  },{passive:true});
  btn.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>
