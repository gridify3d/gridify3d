<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DonTippspiel – WM 2026</title>
<style>
:root {
  --bg:    #f5f5f7;
  --bg2:   #ffffff;
  --bg3:   #f0f0f2;
  --bg4:   #e5e5ea;
  --gold:  #1c6ef3;
  --gold2: #0051d4;
  --green: #34c759;
  --green2:#28a548;
  --red:   #ff3b30;
  --blue:  #1c6ef3;
  --txt:   #1d1d1f;
  --txt2:  #515154;
  --txt3:  #8e8e93;
  --border:#d2d2d7;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input[type=number]{font-family:inherit;-moz-appearance:textfield;-webkit-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0;display:none}

.header{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.header h1{font-size:1.15em;color:var(--txt);font-weight:700;letter-spacing:-.3px}
.header h1 span{color:var(--txt3);font-weight:400;font-size:.72em;display:block;letter-spacing:0}
.tabs{display:flex;gap:2px;background:var(--bg3);padding:6px 16px;overflow-x:auto;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.tab{padding:6px 13px;border:none;background:transparent;color:var(--txt3);font-size:.8em;font-weight:500;border-radius:8px;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--txt);background:rgba(0,0,0,.05)}
.tab.active{color:var(--blue);background:var(--bg2);box-shadow:var(--shadow-sm);font-weight:600}
.main{max-width:920px;margin:0 auto;padding:20px 16px}

.params-toggle{background:var(--bg2);border:1px solid var(--border);color:var(--txt2);padding:8px 16px;border-radius:var(--radius);font-size:.85em;width:100%;text-align:left;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.params-toggle:hover{background:var(--bg3)}
.params-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:none;box-shadow:var(--shadow-sm)}
.params-panel.open{display:block}
.params-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.param-item{display:flex;flex-direction:column;gap:4px}
.param-item label{font-size:.72em;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.param-item input{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:.9em;width:100%}
.param-item input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,110,243,.12)}

.group-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.group-header h2{font-size:1.15em;color:var(--txt);font-weight:700;letter-spacing:-.2px}
.matchday{margin-bottom:24px}
.matchday-title{font-size:.75em;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600}
.matchday-title .md-date{color:var(--txt3);font-weight:400}

.match-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;position:relative;transition:all .2s;box-shadow:var(--shadow-sm)}
.match-card.is-locked{border-color:var(--green);border-left:4px solid var(--green);background:linear-gradient(135deg,rgba(52,199,89,.04),var(--bg2))}
.match-card.is-prediction{border-left:4px solid var(--bg4)}

.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:8px}
.match-team{display:flex;align-items:center;gap:8px;font-size:.9em;font-weight:600;color:var(--txt)}
.match-team.away{justify-content:flex-end;text-align:right}
.match-team .flag{font-size:1.3em}
.match-status{display:flex;align-items:center;gap:6px;font-size:.7em;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.match-status.prediction{color:var(--txt3)}
.match-status.played{color:var(--green)}
.match-score-display{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.6em;font-weight:800;letter-spacing:2px;min-height:40px}
.match-score-display.is-pred{color:var(--txt3);font-weight:500}
.match-score-display.is-played{color:var(--green)}
.match-score-display .sep{color:var(--border);font-weight:300}
.match-meta{text-align:center;font-size:.7em;color:var(--txt3);margin-top:4px}
.match-meta .prob{margin-right:8px}
.match-input-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bg4)}
.match-input-row label{font-size:.75em;color:var(--txt3);white-space:nowrap;font-weight:500}
.match-input-row input{width:42px;height:36px;text-align:center;background:var(--bg3);border:1.5px solid var(--border);color:var(--txt);border-radius:8px;font-size:1.05em;font-weight:700;transition:all .15s}
.match-input-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,110,243,.12);background:var(--bg2)}
.match-input-row input.filled{border-color:var(--blue);background:rgba(28,110,243,.06)}
.match-input-row .sep{color:var(--txt3);font-weight:700;font-size:1.1em}
.btn-lock{padding:6px 14px;border:none;border-radius:8px;font-size:.78em;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:4px}
.btn-lock.lock{background:var(--green);color:#fff}
.btn-lock.lock:hover{background:var(--green2)}
.btn-lock.lock:disabled{background:var(--bg4);color:var(--txt3);cursor:not-allowed}
.btn-lock.unlock{background:transparent;border:1px solid var(--border);color:var(--txt3)}
.btn-lock.unlock:hover{border-color:var(--red);color:var(--red)}
.pred-was{text-align:center;font-size:.7em;color:var(--txt3);margin-top:4px;font-style:italic}

.group-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.82em}
.group-table th{text-align:left;padding:8px 10px;color:var(--txt3);font-size:.7em;text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--border);font-weight:600}
.group-table th.num{text-align:center}
.group-table td{padding:8px 10px;border-bottom:1px solid var(--bg4)}
.group-table td.num{text-align:center}
.group-table tr.q1 td{background:rgba(52,199,89,.07)}
.group-table tr.q2 td{background:rgba(52,199,89,.03)}
.group-table tr.q3 td{background:rgba(28,110,243,.04)}
.group-table .team-cell{display:flex;align-items:center;gap:8px}
.group-table .pos{color:var(--txt3);font-weight:700;width:18px}
.legend{display:flex;gap:16px;margin-top:8px;font-size:.68em;color:var(--txt3);flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.legend .l1::before{background:rgba(52,199,89,.4)}
.legend .l2::before{background:rgba(52,199,89,.2)}
.legend .l3::before{background:rgba(28,110,243,.2)}

.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.overview-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
.overview-card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.overview-card h4{color:var(--txt);font-size:.85em;margin-bottom:8px;font-weight:700}
.overview-team{display:flex;align-items:center;gap:6px;font-size:.82em;padding:3px 0;color:var(--txt2)}
.overview-team.first{font-weight:700;color:var(--green)}
.overview-team.second{color:var(--txt);font-weight:500}
.overview-team.third{color:var(--txt3)}
.overview-team.fourth{color:var(--txt3);opacity:.7}
.overview-elo{margin-left:auto;font-size:.75em;color:var(--txt3)}

.ko-round{margin-bottom:28px}
.ko-round-title{font-size:.75em;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600}
.ko-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;transition:all .2s;box-shadow:var(--shadow-sm)}
.ko-card.is-locked{border-color:var(--green);border-left:4px solid var(--green);background:linear-gradient(135deg,rgba(52,199,89,.05),var(--bg2))}
.ko-card.is-prediction{border-left:4px solid var(--bg4)}
.ko-card.is-pending{border-left:4px solid var(--border);opacity:.5}
.ko-card-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:6px}
.ko-card-team{display:flex;align-items:center;gap:6px;font-size:.88em;font-weight:600;color:var(--txt)}
.ko-card-team.away{justify-content:flex-end;text-align:right}
.ko-card-team.tbd{color:var(--txt3);font-style:italic;font-weight:400}
.ko-score-center{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:100px}
.ko-score-disp{font-size:1.5em;font-weight:800;letter-spacing:2px;color:var(--txt)}
.ko-score-disp.pred{color:var(--txt3);font-weight:500;font-size:1.1em}
.ko-score-disp.real{color:var(--green)}
.ko-status{font-size:.65em;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.ko-status.pred{color:var(--txt3)}
.ko-status.real{color:var(--green)}
.ko-probs{font-size:.65em;color:var(--txt3);text-align:center}
.ko-input-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bg4)}
.ko-input-row input{width:38px;height:32px;text-align:center;background:var(--bg3);border:1.5px solid var(--border);color:var(--txt);border-radius:8px;font-size:1em;font-weight:700;transition:all .15s}
.ko-input-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,110,243,.12)}
.ko-input-row input.filled{border-color:var(--blue);background:rgba(28,110,243,.06)}
.ko-input-row .sep{color:var(--txt3);font-weight:700}
.ko-et-label{font-size:.7em;color:var(--txt3);margin-left:4px}
.ko-winner-badge{display:inline-flex;align-items:center;gap:4px;font-size:.72em;color:var(--blue);margin-top:4px;text-align:center}

#bracketWrap{overflow:visible;padding:12px 0;cursor:grab;user-select:none}
#bracketWrap:active{cursor:grabbing}
#bracketCanvas{display:block;margin:0 auto;transform-origin:top left}
.bracket-legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:.72em;color:var(--txt3)}
.bracket-legend span{display:flex;align-items:center;gap:4px}
.bracket-legend span::before{content:'';display:inline-block;width:12px;height:4px;border-radius:2px}
.bracket-legend .bl-pred::before{background:#c7d0de}
.bracket-legend .bl-real::before{background:#34c759}

.bracket-group-map{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:4px;box-shadow:var(--shadow-sm)}
.bgm-title{font-size:.75em;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.bgm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.bgm-match{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.bgm-matchlabel{font-size:.68em;color:var(--txt3);font-weight:600;letter-spacing:.5px;margin-bottom:2px}
.bgm-slot{display:flex;align-items:center;gap:6px;min-height:20px}
.bgm-slot.right{flex-direction:row-reverse;text-align:right}
.bgm-grp{font-size:.72em;font-weight:700;white-space:nowrap;cursor:pointer;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.05);transition:background .15s}
.bgm-grp:hover{background:rgba(0,0,0,.1)}
.bgm-team{font-size:.78em;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgm-tbd{font-size:.75em;color:var(--txt3);font-style:italic}
.bgm-vs{font-size:.7em;color:var(--txt3);font-weight:700;align-self:center;flex-shrink:0;padding:0 4px}

/* Dual prediction columns */
.pred-cols{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;gap:0;margin:10px 0 4px;background:var(--bg3);border-radius:10px;overflow:hidden;width:100%}
.pred-col{padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0;overflow:hidden}
.pred-col-ext{background:rgba(28,110,243,.04)}
.pred-col-top{background:rgba(240,156,0,.05)}
.pred-divider{background:var(--border)}
.pred-col-label{font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3)}
.pred-col-score{font-size:1.7em;font-weight:800;letter-spacing:2px;color:var(--txt);line-height:1.1}
.pred-col-score-diff{color:var(--blue)}
.pred-col-meta{display:flex;gap:8px;font-size:.68em;color:var(--txt3);margin-top:1px}
.pred-col-detail{font-size:.62em;color:var(--txt3);font-family:'SF Mono',Monaco,monospace}
.pred-take-btn{margin-top:6px;padding:4px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--txt2);font-size:.72em;font-weight:600;cursor:pointer;transition:all .15s}
.pred-take-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(28,110,243,.06)}
.pred-take-ext{border-color:rgba(28,110,243,.3);color:var(--blue)}
.pred-take-ext:hover{background:rgba(28,110,243,.12)}

.ag-date-group{margin-bottom:24px}
.ag-date-header{font-size:.75em;color:var(--txt);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--blue);font-weight:700;display:flex;align-items:center;gap:8px}
.ag-group-badge{font-size:.72em;font-weight:600;color:var(--blue);background:rgba(28,110,243,.09);border:1px solid rgba(28,110,243,.2);border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap;transition:background .15s}
.ag-group-badge:hover{background:rgba(28,110,243,.18)}

.elo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.elo-item{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:.85em;box-shadow:var(--shadow-sm)}
.elo-item .flag{font-size:1.1em}
.elo-item input{width:60px;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:4px 6px;border-radius:6px;text-align:center;font-size:.85em;margin-left:auto}
.elo-item input:focus{outline:none;border-color:var(--blue)}
.elo-diff{font-size:.7em;width:40px;text-align:right}
.elo-diff.up{color:var(--green)}
.elo-diff.down{color:var(--red)}

.btn{padding:8px 16px;border:none;border-radius:10px;font-size:.85em;font-weight:600;transition:all .15s}
.btn-gold{background:var(--blue);color:#fff}
.btn-gold:hover{background:var(--gold2)}
.btn-outline{background:var(--bg2);border:1px solid var(--border);color:var(--txt2);box-shadow:var(--shadow-sm)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-red{background:var(--red);color:white}
.actions{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.export-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:'SF Mono',Monaco,monospace;font-size:.78em;color:var(--txt2);white-space:pre-wrap;max-height:400px;overflow-y:auto;margin-top:12px;user-select:all}
.info-box{background:rgba(28,110,243,.06);border:1px solid rgba(28,110,243,.18);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:.82em;color:var(--blue);line-height:1.5}

.api-section{margin-bottom:24px}
.api-section h3{color:var(--txt);font-size:.95em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);font-weight:600}
.token-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.token-row input[type=text]{flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:10px;font-family:'SF Mono',Monaco,monospace;font-size:.85em}
.token-row input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,110,243,.12)}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:.8em;font-weight:600}
.status-badge.ok{background:rgba(52,199,89,.12);color:var(--green);border:1px solid rgba(52,199,89,.3)}
.status-badge.error{background:rgba(255,59,48,.1);color:var(--red);border:1px solid rgba(255,59,48,.25)}
.status-badge.loading{background:rgba(28,110,243,.1);color:var(--blue);border:1px solid rgba(28,110,243,.25)}
.status-badge.idle{background:var(--bg3);color:var(--txt3);border:1px solid var(--border)}
.update-log{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;max-height:320px;overflow-y:auto;margin-top:12px}
.log-entry{padding:5px 0;border-bottom:1px solid var(--border);font-size:.8em;display:flex;gap:10px;align-items:flex-start}
.log-entry:last-child{border-bottom:none}
.log-entry .log-icon{flex-shrink:0}
.log-entry.new{color:var(--green)}
.log-entry.skip{color:var(--txt3)}
.log-entry.warn{color:#f09c00}
.log-entry.err{color:var(--red)}
.progress-bar{height:4px;background:var(--bg4);border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}

/* Twemoji */
img.emoji{width:1.15em;height:1.15em;vertical-align:-0.18em;display:inline-block}
.flag img.emoji{width:1.25em;height:1.25em}

/* Scroll-to-top button */
#scrollTopBtn{
  position:fixed;bottom:24px;right:20px;z-index:999;
  width:42px;height:42px;border-radius:50%;border:none;
  background:var(--blue);color:#fff;font-size:1.2em;line-height:1;
  box-shadow:0 4px 14px rgba(28,110,243,.40);
  cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  display:flex;align-items:center;justify-content:center;
}
#scrollTopBtn.visible{opacity:1;pointer-events:auto}
#scrollTopBtn:hover{transform:translateY(-3px);background:var(--gold2)}
#scrollTopBtn:active{transform:translateY(0)}
</style>
</head>

// PRE-COMPUTE ALL KO PREDICTIONS
function getAllThirds(){
  return GN.map((g,gi)=>{
    const tb=calcTable(gi);
    const t=tb[2];
    if(!t) return null;
    return {teamId:t.id, g, pts:t.pts, gd:t.gd, gf:t.gf};
  }).filter(Boolean).sort((a,b)=>
    b.pts-a.pts || b.gd-a.gd || b.gf-a.gf ||
    TEAMS[b.teamId].elo - TEAMS[a.teamId].elo
  );
}

// n = 1-basierter Rang (1 = bester Dritter) — Fallback
function getNthBestThird(n){
  return getAllThirds()[n-1]?.teamId ?? null;
}

// Weist die besten 8 Dritten konfliktfrei den 8 grp3-Slots zu.
// Optimierungsziel: minimiere Summe der globalen Ränge (= beste Teams kommen weiter).
// Backtracking mit Branch & Bound.
let _thirdCache = null;
function getThirdAssignments(){
  if(_thirdCache) return _thirdCache;

  const allThirds = getAllThirds(); // sortiert: Index 0 = bester Dritter
  const slots = [];
  KO_BRACKET.forEach(m=>{
    [m.slotA, m.slotB].forEach((slot,si)=>{
      if(slot.src==='grp3') slots.push({key:m.id+'_'+si, groups:slot.groups});
    });
  });

  let bestScore = Infinity;
  let bestAssigned = new Map();

  // Backtracking: für jeden Slot den besten verfügbaren Kandidaten probieren
  // score = Summe der Ränge der zugewiesenen Teams (niedriger = besser)
  function backtrack(slotIdx, usedTeams, currentScore, currentAssigned){
    if(slotIdx === slots.length){
      if(currentScore < bestScore){
        bestScore = currentScore;
        bestAssigned = new Map(currentAssigned);
      }
      return;
    }

    const slot = slots[slotIdx];
    // Pruning: selbst wenn alle restlichen Slots optimal besetzt werden,
    // können wir bestScore nicht unterbieten
    const remaining = slots.length - slotIdx;
    if(currentScore >= bestScore) return;

    for(let rank=0; rank<allThirds.length; rank++){
      const t = allThirds[rank];
      if(usedTeams.has(t.teamId)) continue;
      if(!slot.groups.includes(t.g)) continue;

      currentAssigned.set(slot.key, t.teamId);
      usedTeams.add(t.teamId);
      backtrack(slotIdx+1, usedTeams, currentScore+rank, currentAssigned);
      currentAssigned.delete(slot.key);
      usedTeams.delete(t.teamId);
    }
    // Falls kein Kandidat → Slot bleibt leer (nicht zählen, aber weiter)
    // (sollte nicht vorkommen bei gültigen Gruppen-Pools)
  }

  backtrack(0, new Set(), 0, new Map());
  _thirdCache = bestAssigned;
  return bestAssigned;
}

function slotLabel(slot){
  if(slot.src==='grp'){
    const pos=['1.','2.','3.'][slot.pos-1]||`${slot.pos}.`;
    return `${pos} Gr. ${slot.g}`;
  }
  if(slot.src==='grp3'){
    const assignments = getThirdAssignments();
    const m = KO_BRACKET.find(x=>x.slotA===slot||x.slotB===slot);
    const si = m ? (m.slotA===slot?0:1) : 0;
    const teamId = m ? assignments.get(m.id+'_'+si) : null;
    const poolStr = slot.groups.join('/');
    return teamId ? `Bester 3. (${poolStr}) → ${TEAMS[teamId].flag} ${TEAMS[teamId].name}` : `Bester 3. (${poolStr})`;
  }
  const m=KO_BRACKET.find(x=>x.id===slot.id);
  const rnd={r32:'R32',r16:'AF',qf:'VF',sf:'HF',final:'F','3p':'3P'}[m?.round]||'?';
  return slot.w?`Sieger ${rnd} ${m?.label||''}`:`Verlierer ${rnd} ${m?.label||''}`;
}

function resolveSlot(slot, koOverride){
  const KR = koOverride || koResults;
  if(slot.src==='grp'){
    const gi=GN.indexOf(slot.g);
    const tb=calcTable(gi);
    return tb[slot.pos-1]?.id ?? null;
  }
  if(slot.src==='grp3'){
    const assignments = getThirdAssignments();
    // slot hier hat kein matchId — wir brauchen den Kontext.
    // resolveSlot wird mit dem Slot-Objekt aufgerufen, aber ohne matchId.
    // Wir finden das Match über KO_BRACKET.
    const m = KO_BRACKET.find(x=>x.slotA===slot||x.slotB===slot);
    if(!m) return null;
    const si = m.slotA===slot ? 0 : 1;
    return assignments.get(m.id+'_'+si) ?? null;
  }
  // src === 'ko'
  const kr = KR[slot.id];
  if(!kr||!kr.locked) return null;
  const m=KO_BRACKET.find(x=>x.id===slot.id);
  if(!m) return null;
  const tA=resolveSlot(m.slotA, KR), tB=resolveSlot(m.slotB, KR);
  if(tA===null||tB===null) return null;
  if(slot.w){
    if(kr.goalsA>kr.goalsB) return tA;
    if(kr.goalsB>kr.goalsA) return tB;
    if(kr.pens==='A') return tA;
    if(kr.pens==='B') return tB;
    return null;
  } else {
    if(kr.goalsA>kr.goalsB) return tB;
    if(kr.goalsB>kr.goalsA) return tA;
    return null;
  }
}

// resolveSlot variant that only uses locked results — no predictions, no calcTable fallback
function groupLockedCount(gi){
  let n=0;
  for(let md=0;md<3;md++) for(let mi=0;mi<2;mi++){
    const r=results[`g${gi}_m${md*2+mi}`];
    if(r&&r.locked) n++;
  }
  return n;
}
function groupFullyLocked(gi){ return groupLockedCount(gi)===6; }
function groupHasAnyLocked(gi){ return groupLockedCount(gi)>0; }

function getThirdAssignmentsLocked(){
  // Like getThirdAssignments but only uses locked results (partial standings OK)
  const allThirds = GN.map((g,gi)=>{
    if(!groupHasAnyLocked(gi)) return null;
    const tb=calcTableLocked(gi);
    const t=tb[2];
    if(!t||t.played===0) return null;
    return {teamId:t.id, g, pts:t.pts, gd:t.gd, gf:t.gf};
  }).filter(Boolean).sort((a,b)=>
    b.pts-a.pts || b.gd-a.gd || b.gf-a.gf ||
    TEAMS[b.teamId].elo - TEAMS[a.teamId].elo
  );

  const slots = [];
  KO_BRACKET.forEach(m=>{
    [m.slotA, m.slotB].forEach((slot,si)=>{
      if(slot.src==='grp3') slots.push({key:m.id+'_'+si, groups:slot.groups});
    });
  });

  let bestScore = Infinity;
  let bestAssigned = new Map();

  function backtrack(slotIdx, usedTeams, currentScore, currentAssigned){
    if(slotIdx === slots.length){
      if(currentScore < bestScore){ bestScore=currentScore; bestAssigned=new Map(currentAssigned); }
      return;
    }
    const slot = slots[slotIdx];
    if(currentScore >= bestScore) return;
    for(let rank=0; rank<allThirds.length; rank++){
      const t = allThirds[rank];
      if(usedTeams.has(t.teamId)) continue;
      if(!slot.groups.includes(t.g)) continue;
      currentAssigned.set(slot.key, t.teamId);
      usedTeams.add(t.teamId);
      backtrack(slotIdx+1, usedTeams, currentScore+rank, currentAssigned);
      currentAssigned.delete(slot.key);
      usedTeams.delete(t.teamId);
    }
  }
  backtrack(0, new Set(), 0, new Map());
  return bestAssigned;
}

function resolveSlotLocked(slot, koOverride){
  const KR = koOverride || koResults;
  if(slot.src==='grp'){
    const gi=GN.indexOf(slot.g);
    if(!groupHasAnyLocked(gi)) return null;
    const tb=calcTableLocked(gi);
    const entry=tb[slot.pos-1];
    if(!entry||entry.played===0) return null;
    // Only return if fully locked (position is final) OR team has played all possible games
    // to have this position secured
    if(groupFullyLocked(gi)) return entry.id;
    // Partially played: only show if team has enough pts to be unambiguous
    // Safe rule: show if all 6 matches locked, otherwise show (partial standings are useful too)
    return entry.id;
  }
  if(slot.src==='grp3'){
    // Only resolve if enough groups are fully locked to determine best thirds
    const assignments = getThirdAssignmentsLocked();
    const m = KO_BRACKET.find(x=>x.slotA===slot||x.slotB===slot);
    if(!m) return null;
    const si = m.slotA===slot ? 0 : 1;
    return assignments.get(m.id+'_'+si) ?? null;
  }
  // src === 'ko'
  const kr = KR[slot.id];
  if(!kr||!kr.locked) return null;
  const m=KO_BRACKET.find(x=>x.id===slot.id);
  if(!m) return null;
  const tA=resolveSlotLocked(m.slotA, KR), tB=resolveSlotLocked(m.slotB, KR);
  if(tA===null||tB===null) return null;
  if(slot.w){
    if(kr.goalsA>kr.goalsB) return tA;
    if(kr.goalsB>kr.goalsA) return tB;
    if(kr.pens==='A') return tA;
    if(kr.pens==='B') return tB;
    return null;
  } else {
    if(kr.goalsA>kr.goalsB) return tB;
    if(kr.goalsB>kr.goalsA) return tA;
    return null;
  }
}

// PRE-COMPUTE ALL KO PREDICTIONS

let koPredictions = {};

function computeKOPredictions(){
  koPredictions = {};

  // OR koPredictions (computed predictions) as fallback
  function resolveForPred(slot){
    if(slot.src==='grp'){
      const gi=GN.indexOf(slot.g);
      return calcTable(gi)[slot.pos-1]?.id ?? null;
    }
    if(slot.src==='grp3'){
      const assignments = getThirdAssignments();
      const m = KO_BRACKET.find(x=>x.slotA===slot||x.slotB===slot);
      if(!m) return null;
      const si = m.slotA===slot ? 0 : 1;
      return assignments.get(m.id+'_'+si) ?? null;
    }
    // src='ko': first check real locked result
    const kr=koResults[slot.id];
    if(kr&&kr.locked){
      // resolve from real result
      const m=KO_BRACKET.find(x=>x.id===slot.id);
      if(!m) return null;
      const tA=resolveForPred(m.slotA), tB=resolveForPred(m.slotB);
      if(tA===null||tB===null) return null;
      if(slot.w){
        if(kr.goalsA>kr.goalsB) return tA;
        if(kr.goalsB>kr.goalsA) return tB;
        if(kr.pens==='A') return tA;
        if(kr.pens==='B') return tB;
        return tA;
      } else {
        if(kr.goalsA>kr.goalsB) return tB;
        if(kr.goalsB>kr.goalsA) return tA;
        return tB;
      }
    }
    // fallback: use computed prediction
    const pred=koPredictions[slot.id];
    if(!pred) return null;
    if(slot.w) return pred.goalsA>=pred.goalsB ? pred.teamA : pred.teamB;
    else       return pred.goalsA>=pred.goalsB ? pred.teamB : pred.teamA;
  }

  const rounds=[
    ['r32_1','r32_2','r32_3','r32_4','r32_5','r32_6','r32_7','r32_8',
     'r32_9','r32_10','r32_11','r32_12','r32_13','r32_14','r32_15','r32_16'],
    ['r16_1','r16_2','r16_3','r16_4','r16_5','r16_6','r16_7','r16_8'],
    ['qf_1','qf_2','qf_3','qf_4'],
    ['sf_1','sf_2'],
    ['3p_1','final_1'],
  ];

  for(const roundMatches of rounds){
    for(const mid of roundMatches){
      const m=KO_BRACKET.find(x=>x.id===mid);
      if(!m) continue;
      // If already locked with real result, skip prediction
      if(koResults[mid]&&koResults[mid].locked) continue;
      const tAid=resolveForPred(m.slotA);
      const tBid=resolveForPred(m.slotB);
      if(tAid===null||tBid===null) continue;
      const pr=predictMatchExt(tAid,tBid);
      let gA=pr.goalsA, gB=pr.goalsB;
      // KO: no draws in predictions
      if(gA===gB){ if(pr.pW>=pr.pL) gA++; else gB++; }
      koPredictions[mid]={
        goalsA:gA, goalsB:gB,
        teamA:tAid, teamB:tBid,
        pW:pr.pW, pD:pr.pD, pL:pr.pL
      };
    }
  }
}

// ============================================================
// ENGINE — optimierte Defaults
// ============================================================
const SAVE_VERSION = 6; // Erhöhen wenn P-Defaults sich ändern → P wird zurückgesetzt, Tipps bleiben
let P={baseGoals:1.25,eloFactor:380,hostBoost:65,homeBoost:0,kFactor:20};

function fac(n){let f=1;for(let i=2;i<=n;i++)f*=i;return f}
function ppf(k,l){return l<=0?(k===0?1:0):Math.pow(l,k)*Math.exp(-l)/fac(k)}

function scoreLines(lA,lB,maxGoals=7){
  const rows=[];
  for(let a=0;a<=maxGoals;a++) for(let b=0;b<=maxGoals;b++){
    rows.push({a,b,p:ppf(a,lA)*ppf(b,lB)});
  }
  rows.sort((x,y)=>y.p-x.p);
  return rows;
}

// Liefert nicht blind die mathematisch häufigste Scoreline, sondern einen
// kalibrierten Standardtipp: Outcome aus der Verteilung, Torhöhe aus λ+Tempo.
// Dadurch bleiben Tipps plausibel, aber nicht künstlich auf 1:0/2:0/2:1 fixiert.
function chooseStandardScore(lA,lB,pW,pD,pL,pace=1){
  const total=lA+lB;
  const outcome = pW>=pD && pW>=pL ? 'W' : pD>=pW && pD>=pL ? 'D' : 'L';
  let targetTotal = Math.round(total);
  if(pace>1.08 && total>2.30) targetTotal=Math.ceil(total);
  if(pace>1.14 && total>2.65) targetTotal=Math.min(5, Math.ceil(total+.35));
  if(pace<0.94 && total<2.80) targetTotal=Math.floor(total);
  targetTotal=clamp(targetTotal, outcome==='D'?0:1, 6);

  let best=null, bestVal=-Infinity;
  for(const s of scoreLines(lA,lB,7)){
    const valid = outcome==='W' ? s.a>s.b : outcome==='D' ? s.a===s.b : s.a<s.b;
    if(!valid) continue;
    let val = Math.log(s.p+1e-12);
    val -= 0.58*Math.abs((s.a+s.b)-targetTotal);
    val -= 0.22*(Math.abs(s.a-lA)+Math.abs(s.b-lB));

    // Favorit mit klar niedriger Gegner-λ soll eher zu Null tippen.
    if(lA>lB){
      if(lB<0.75 && s.b>0) val-=0.65;
      if(lA>1.75 && s.a<2) val-=0.35;
    }else{
      if(lA<0.75 && s.a>0) val-=0.65;
      if(lB>1.75 && s.b<2) val-=0.35;
    }
    // Offene Spiele dürfen nicht künstlich auf 1:0/1:1 zusammenfallen.
    if(pace>1.10 && total>2.35 && (s.a+s.b)<3) val-=0.35;
    if(pace<0.92 && (s.a+s.b)>2) val-=0.40;

    if(val>bestVal){ bestVal=val; best=s; }
  }
  return best || scoreLines(lA,lB,7)[0] || {a:1,b:0,p:0};
}

function topScoreText(lA,lB,n=5){
  return scoreLines(lA,lB,7).slice(0,n).map(x=>`${x.a}:${x.b} ${(x.p*100).toFixed(1)}%`).join(' · ');
}

function effElo(id){return TEAMS[id].elo+(HOST_IDS.includes(id)?P.hostBoost:0)}

function predictMatch(idA,idB){
  const diff=(effElo(idA)-effElo(idB)+P.homeBoost)/P.eloFactor;
  const lA=Math.max(.15,P.baseGoals+diff/2);
  const lB=Math.max(.15,P.baseGoals-diff/2);
  let pW=0,pD=0,pL=0;
  for(let a=0;a<=7;a++)for(let b=0;b<=7;b++){
    const p=ppf(a,lA)*ppf(b,lB);
    if(a>b)pW+=p;else if(a===b)pD+=p;else pL+=p;
  }
  const tip=chooseStandardScore(lA,lB,pW,pD,pL,1);
  const gA=tip.a, gB=tip.b;
  return{goalsA:gA,goalsB:gB,lA,lB,pW,pD,pL,pExact:tip.p,topScores:topScoreText(lA,lB)};
}

// Zieht ein realistisches Ergebnis aus der vollen Poisson-Verteilung.
// Nicht der wahrscheinlichste Ausgang, sondern ein gewichtetes Zufallssample —
// damit kommen auch 0:0, 3:2, 2:0 usw. angemessen häufig vor.
function sampleMatch(idA, idB){
  const {lA, lB, pW, pD, pL} = predictMatch(idA, idB);
  // Baue die kumulierte Verteilung für alle Scorelines 0:0 bis 7:7
  const scores=[];
  for(let a=0;a<=7;a++) for(let b=0;b<=7;b++)
    scores.push({a, b, p: ppf(a,lA)*ppf(b,lB)});
  // Normalisieren (die Masse bis 7:7 ist ~99.9%, gut genug)
  const total=scores.reduce((s,x)=>s+x.p,0);
  let r=Math.random()*total;
  for(const s of scores){
    r-=s.p;
    if(r<=0) return {goalsA:s.a, goalsB:s.b};
  }
  return {goalsA:1, goalsB:0}; // Fallback
}

// Erweiterte Prognose: Elo-Basis × Goal-Profile
// Elo bestimmt die Grundstärke. goalRate verändert nur die erwartete Gesamt-Torzahl,
// balance verschiebt nur den Toranteil zwischen den Teams. Dadurch wird Stärke nicht doppelt gezählt.
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function predictMatchExt(idA, idB){
  const rA=TEAM_RATINGS[idA], rB=TEAM_RATINGS[idB];
  const diff=(effElo(idA)-effElo(idB)+P.homeBoost)/P.eloFactor;
  const lAbase=Math.max(.15, P.baseGoals+diff/2);
  const lBbase=Math.max(.15, P.baseGoals-diff/2);

  const baseTotal = lAbase + lBbase;
  const baseShareA = lAbase / Math.max(baseTotal, .1);

  // Torprofil: beide Teams beeinflussen gemeinsam, ob das Spiel eher offen oder geschlossen wird.
  const pace = clamp(Math.sqrt((rA.goalRate||1) * (rB.goalRate||1)), .80, 1.25);

  // Balance: kleine Stil-Korrektur auf den Toranteil, nicht auf die Gesamtstärke.
  const shareA = clamp(baseShareA + (rA.balance||0) - (rB.balance||0), .20, .80);
  const totalGoals = clamp(baseTotal * pace, .40, 5.20);

  const lA = clamp(totalGoals * shareA, .15, 4.0);
  const lB = clamp(totalGoals * (1-shareA), .15, 4.0);

  let pW=0,pD=0,pL=0;
  for(let a=0;a<=7;a++) for(let b=0;b<=7;b++){
    const p=ppf(a,lA)*ppf(b,lB);
    if(a>b)pW+=p; else if(a===b)pD+=p; else pL+=p;
  }

  const tip=chooseStandardScore(lA,lB,pW,pD,pL,pace);
  const gA=tip.a, gB=tip.b;
  return{goalsA:gA,goalsB:gB,lA,lB,pW,pD,pL,pExact:tip.p,pace,shareA,topScores:topScoreText(lA,lB)};
}

function updateEloSingle(idA,idB,gA,gB){
  const eA=TEAMS[idA].elo, eB=TEAMS[idB].elo;
  const exA=1/(1+Math.pow(10,(eB-eA)/400));
  const act=gA>gB?1:(gA===gB?.5:0);

  // Tordifferenz-Multiplikator (FiveThirtyEight-Methode):
  // log(|TD|+1) dämpft grosse Siege, Elo-Diff-Korrektur verhindert Aufblasen bei Kantersiegen
  const td=Math.abs(gA-gB);
  const eloDiff=Math.abs(eA-eB);
  const goalMult = td===0 ? 1 : Math.log(td+1) * (2.2/(eloDiff*0.001+2.2));

  const d=P.kFactor*goalMult*(act-exA);
  TEAMS[idA].elo=Math.round(eA+d);
  TEAMS[idB].elo=Math.round(eB-d);
}

// Alle Elos ab Basis neu berechnen basierend auf gesperrten Resultaten
function recalcAllElos(){
  TEAMS.forEach(t=>t.elo=t.base);
  // Team-Stärken auf Basis-Werte zurücksetzen vor Neuberechnung
  TEAM_RATINGS.forEach((r,i)=>{ r.goalRate=DEFAULT_RATINGS[i].goalRate; r.balance=DEFAULT_RATINGS[i].balance; });
  _prePredCache={}; // Cache leeren — wird unten pro gesperrtem Spiel befüllt
  for(let md=0;md<3;md++){
    for(let gi=0;gi<12;gi++){
      for(let mi=0;mi<2;mi++){
        const k=`g${gi}_m${md*2+mi}`;
        const r=results[k];
        if(r&&r.locked){
          const tids=GROUPS[gi];
          const[hi,ai]=MATCH_PAIRS[gi][md][mi];
          // Pre-Update-Vorhersagen cachen (alle 3 Modelle) — Elo-Stand VOR diesem Spiel
          const pElo = predictMatch(tids[hi],tids[ai]);
          const pPP  = predictMatchExt(tids[hi],tids[ai]);
          const slPP = scoreLines(pPP.lA, pPP.lB, 7);
          _prePredCache[k] = {
            elo:   {goalsA: pElo.goalsA,  goalsB: pElo.goalsB},
            pp:    {goalsA: pPP.goalsA,   goalsB: pPP.goalsB},
            toppp: {goalsA: slPP[0].a,    goalsB: slPP[0].b}
          };
          updateTeamRatings(tids[hi],tids[ai],r.goalsA,r.goalsB,pPP.lA,pPP.lB);
          updateEloSingle(tids[hi],tids[ai],r.goalsA,r.goalsB);
        }
      }
    }
  }
  applyMotivationBonus();
}

// Passt goalRate/balance der Teams an basierend auf Über-/Unterperformance
// gegenüber der Erwartung vor dem Spiel.
function updateTeamRatings(idA, idB, gA, gB, expA, expB){
  const LEARN = 0.06;
  const gAn = parseInt(gA), gBn = parseInt(gB);
  const expTotal = Math.max(.8, expA + expB);
  const actTotal = gAn + gBn;

  // goalRate lernt nur: war das Spiel torreicher/torärmer als erwartet?
  const totalDiff = clamp((actTotal - expTotal) / expTotal, -0.50, 0.50);
  TEAM_RATINGS[idA].goalRate = clamp(TEAM_RATINGS[idA].goalRate + LEARN * totalDiff * 0.50, .85, 1.18);
  TEAM_RATINGS[idB].goalRate = clamp(TEAM_RATINGS[idB].goalRate + LEARN * totalDiff * 0.50, .85, 1.18);

  // balance lernt nur: hat Team A einen höheren/niedrigeren Toranteil erreicht als erwartet?
  // 0.35 glättet 0-Tore-Spiele, damit 1 einzelnes 0:0 nicht extrem wirkt.
  const expShareA = expA / Math.max(expA + expB, .1);
  const actShareA = (gAn + .35) / Math.max(actTotal + .70, .70);
  const shareDiff = clamp(actShareA - expShareA, -0.35, 0.35);
  TEAM_RATINGS[idA].balance = clamp(TEAM_RATINGS[idA].balance + LEARN * shareDiff, -.10, .10);
  TEAM_RATINGS[idB].balance = clamp(TEAM_RATINGS[idB].balance - LEARN * shareDiff, -.10, .10);
}

// Turnier-Motivation: Bonus/Malus basierend auf Gruppenphase-Verlauf
// Fliesst direkt in t.elo ein → wirkt auf alle Prognosen
function applyMotivationBonus(){
  const assignments = _thirdCache; // bereits berechnet wenn vorhanden

  for(let gi=0;gi<12;gi++){
    const tids=GROUPS[gi];
    const tb=calcTable(gi);

    // Wieviele Spiele hat diese Gruppe gespielt (gesperrt)?
    let played=0;
    for(let i=0;i<6;i++){ const r=results[`g${gi}_m${i}`]; if(r&&r.locked) played++; }
    if(played===0) continue;

    // Punkte und Tordifferenz pro Team aus gesperrten Spielen
    const stats={}; // teamId → {pts, gd, gf, wins, draws, losses}
    tids.forEach(id=>stats[id]={pts:0,gd:0,gf:0,wins:0,draws:0,losses:0});

    for(let md=0;md<3;md++){
      for(let mi=0;mi<2;mi++){
        const k=`g${gi}_m${md*2+mi}`;
        const r=results[k];
        if(!r||!r.locked) continue;
        const[hi,ai]=MATCH_PAIRS[gi][md][mi];
        const hid=tids[hi], aid=tids[ai];
        const gA=parseInt(r.goalsA), gB=parseInt(r.goalsB);
        stats[hid].gf+=gA; stats[hid].gd+=(gA-gB);
        stats[aid].gf+=gB; stats[aid].gd+=(gB-gA);
        if(gA>gB){stats[hid].pts+=3;stats[hid].wins++;stats[aid].losses++;}
        else if(gA===gB){stats[hid].pts+=1;stats[hid].draws++;stats[aid].pts+=1;stats[aid].draws++;}
        else{stats[aid].pts+=3;stats[aid].wins++;stats[hid].losses++;}
      }
    }

    // Nur nach Abschluss der Gruppenphase (6 Spiele) Positions-Bonus vergeben
    const allGroupDone = played===6;

    tids.forEach(id=>{
      const s=stats[id];
      let bonus=0;

      // 1. Siegesserie-Momentum
      bonus += s.wins * 4;
      bonus += s.losses * (-3);
      bonus += Math.sign(s.gd) * Math.min(Math.abs(s.gd), 5) * 1.5;

      // 2. Gruppen-Abschluss-Bonus (nur wenn alle 6 Spiele gespielt)
      if(allGroupDone){
        const pos=tb.findIndex(t=>t.id===id);
        if(pos===0) bonus+=10;       // Gruppensieger
        else if(pos===1) bonus+=4;   // Zweiter
        else if(pos===2){
          const asgn=getThirdAssignments();
          const isQualified=[...asgn.values()].includes(id);
          bonus += isQualified ? 1 : -8;
        }
        else bonus-=10;              // Letzter: ausgeschieden
      }

      TEAMS[id].elo=Math.round(TEAMS[id].elo+bonus);
    });
  }

  // K.o.-Runden Motivation
  const koRoundBonus={r32:8,r16:12,qf:18,sf:22,final:30};
  KO_BRACKET.forEach(m=>{
    const kr=koResults[m.id];
    if(!kr||!kr.locked) return;
    const bonus=koRoundBonus[m.round]||10;
    // Sieger
    const tAid=resolveSlot(m.slotA), tBid=resolveSlot(m.slotB);
    if(tAid===null||tBid===null) return;
    const gA=parseInt(kr.goalsA), gB=parseInt(kr.goalsB);
    let winnerId=null, loserId=null;
    if(gA>gB){winnerId=tAid;loserId=tBid;}
    else if(gB>gA){winnerId=tBid;loserId=tAid;}
    else if(kr.pens==='A'){winnerId=tAid;loserId=tBid;}
    else if(kr.pens==='B'){winnerId=tBid;loserId=tAid;}
    if(winnerId!==null) TEAMS[winnerId].elo=Math.round(TEAMS[winnerId].elo+bonus);
    if(loserId!==null)  TEAMS[loserId].elo=Math.round(TEAMS[loserId].elo-Math.round(bonus*0.6));
  });
}

// ============================================================
// TABLE
// ============================================================
function calcTable(gi){
  const tids=GROUPS[gi];
  const tb=tids.map(id=>({id,pts:0,gf:0,ga:0,gd:0,w:0,d:0,l:0,played:0}));
  const lk={};tids.forEach((id,i)=>lk[id]=i);

  for(let md=0;md<3;md++){
    for(let mi=0;mi<2;mi++){
      const key=`g${gi}_m${md*2+mi}`;
      const[hi,ai]=MATCH_PAIRS[gi][md][mi];
      const hid=tids[hi],aid=tids[ai];
      const r=results[key];
      let gA,gB,isReal=false;
      if(r&&r.locked){
        // Gesperrtes Resultat — zählt als gespielt
        gA=r.goalsA;gB=r.goalsB;isReal=true;
      } else if(r&&r.goalsA!==''&&r.goalsB!==''){
        // Eingetragener aber ungesperrter Tipp — für Tabelle verwenden, aber nicht als "gespielt" markieren
        gA=r.goalsA;gB=r.goalsB;
      } else {
        // Kein Tipp → Modell-Prognose
        const p=predictMatchExt(hid,aid);gA=p.goalsA;gB=p.goalsB;
      }
      const h=tb[lk[hid]],a=tb[lk[aid]];
      h.gf+=gA;h.ga+=gB;a.gf+=gB;a.ga+=gA;
      if(isReal){h.played++;a.played++}
      if(gA>gB){h.w++;h.pts+=3;a.l++}
      else if(gA===gB){h.d++;h.pts+=1;a.d++;a.pts+=1}
      else{a.w++;a.pts+=3;h.l++}
    }
  }
  tb.forEach(t=>t.gd=t.gf-t.ga);
  tb.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return tb;
}


// Tabelle nur aus gesperrten Resultaten (keine Prognosen)
function calcTableLocked(gi){
  const tids=GROUPS[gi];
  const tb=tids.map(id=>({id,pts:0,gf:0,ga:0,gd:0,w:0,d:0,l:0,played:0}));
  const lk={};tids.forEach((id,i)=>lk[id]=i);
  for(let md=0;md<3;md++){
    for(let mi=0;mi<2;mi++){
      const key=`g${gi}_m${md*2+mi}`;
      const r=results[key];
      if(!r||!r.locked) continue;
      const[hi,ai]=MATCH_PAIRS[gi][md][mi];
      const hid=tids[hi],aid=tids[ai];
      const gA=r.goalsA,gB=r.goalsB;
      const h=tb[lk[hid]],a=tb[lk[aid]];
      h.gf+=gA;h.ga+=gB;h.played++;a.gf+=gB;a.ga+=gA;a.played++;
      if(gA>gB){h.w++;h.pts+=3;a.l++}
      else if(gA===gB){h.d++;h.pts+=1;a.d++;a.pts+=1}
      else{a.w++;a.pts+=3;h.l++}
    }
  }
  tb.forEach(t=>t.gd=t.gf-t.ga);
  tb.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return tb;
}

// ============================================================
// PUNKTEBERECHNUNG — Tippspiel-Scoring (nur gesperrte Spiele)
// 4P = richtiges Resultat
// 3P = richtiger Sieger + richtige Tordifferenz
// 2P = richtiger Sieger (oder: Unentschieden korrekt vorhergesagt, Ergebnis falsch)
// 0P = alles andere
// ============================================================
function calcTippPoints(predA, predB, realA, realB){
  const predWin = predA > predB ? 'A' : predA < predB ? 'B' : 'D';
  const realWin = realA > realB ? 'A' : realA < realB ? 'B' : 'D';
  if(predA === realA && predB === realB) return 4;
  if(predWin !== realWin) return 0;
  if(predWin === 'D') return 2; // Unentschieden korrekt, falsches Ergebnis
  if((predA - predB) === (realA - realB)) return 3; // gleiche Tordifferenz
  return 2; // nur Sieger richtig
}

// Für eine Gruppe alle gesperrten Spiele auswerten
// modelKey: 'elo'|'pp'|'toppp' — liest Pre-Game-Vorhersage aus _prePredCache
function calcGroupScore(gi, modelKey){
  const tids = GROUPS[gi];
  let pts = 0, count = 0, matches = [];
  for(let md=0;md<3;md++){
    for(let mi=0;mi<2;mi++){
      const key = `g${gi}_m${md*2+mi}`;
      const r = results[key];
      if(!r || !r.locked) continue;
      const [hi,ai] = MATCH_PAIRS[gi][md][mi];
      const hid = tids[hi], aid = tids[ai];
      // Pre-Game-Tipp aus Cache — korrekte Vorhersage VOR Elo-Update dieses Spiels
      const cached = _prePredCache[key];
      const tip = cached ? cached[modelKey] : {goalsA:1, goalsB:1}; // Fallback sollte nie eintreten
      const p = calcTippPoints(tip.goalsA, tip.goalsB, r.goalsA, r.goalsB);
      pts += p; count++;
      matches.push({gi, hid, aid, realA:r.goalsA, realB:r.goalsB, tipA:tip.goalsA, tipB:tip.goalsB, pts:p});
    }
  }
  return {pts, count, matches};
}

// Summiert über alle Gruppen — modelKey: 'elo'|'pp'|'toppp'
function calcTotalScore(modelKey){
  let pts=0, count=0, matches=[];
  for(let gi=0;gi<12;gi++){
    const s = calcGroupScore(gi, modelKey);
    pts += s.pts; count += s.count; matches.push(...s.matches);
  }
  return {pts, count, matches};
}

// "Top-Tipp" = das mathematisch wahrscheinlichste Ergebnis (scoreLines[0])
function topTipFn(hid, aid){
  const {lA, lB} = predictMatch(hid, aid);
  const sl = scoreLines(lA, lB, 7);
  return {goalsA: sl[0].a, goalsB: sl[0].b};
}
// Top-Tipp via PowerProfile-Modell
function topTipExtFn(hid, aid){
  const {lA, lB} = predictMatchExt(hid, aid);
  const sl = scoreLines(lA, lB, 7);
  return {goalsA: sl[0].a, goalsB: sl[0].b};
}

      const col = p===4?'var(--green)':p===3?'var(--blue)':p===2?'#f09c00':p===0?'var(--txt3)':'var(--txt3)';
      const bg  = p===4?'rgba(52,199,89,.12)':p===3?'rgba(28,110,243,.10)':p===2?'rgba(240,156,0,.12)':'rgba(0,0,0,.05)';
      return `<span style="display:inline-block;min-width:22px;text-align:center;font-weight:700;font-size:.78em;padding:1px 5px;border-radius:5px;background:${bg};color:${col}">${p}P</span>`;
    };
    const scoreCard = (label, icon, s, color, tip, modelKey) => {
      const p = pct(s.pts);
      const isOpen = activeScoringModel === modelKey;
      return `<div data-scoring-model="${modelKey}" style="background:var(--bg2);border:1.5px solid ${isOpen?color:'var(--border)'};border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-sm);flex:1;min-width:150px;cursor:pointer;transition:border-color .15s">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
          <div>
            <div style="font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);margin-bottom:4px">${icon} ${label}</div>
            <div style="font-size:1.6em;font-weight:800;color:${color};letter-spacing:-.5px;line-height:1">${s.pts}<span style="font-size:.5em;font-weight:500;color:var(--txt3);margin-left:4px">/ ${maxPts} P</span></div>
            <div style="font-size:.72em;color:var(--txt3);margin-top:2px">${p}% · ⌀ ${totalLocked>0?(s.pts/totalLocked).toFixed(1):0} P/Spiel</div>
          </div>
          <span style="font-size:.8em;color:var(--txt3);margin-top:2px">${isOpen?'▲':'▼'}</span>
        </div>
        ${bar(s.pts, color)}
        <div style="font-size:.65em;color:var(--txt3);margin-top:5px;font-style:italic">${tip}</div>
      </div>`;
    };
    // Detail-Tabelle für geöffnetes Modell (ausserhalb des Flex-Containers)
    const detailPanel = (s, color, label) => {
      let d = `<div style="margin-top:10px;background:var(--bg2);border:1.5px solid ${color};border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)">`;
      d += `<div style="font-size:.75em;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">${label} — Spieldetails</div>`;
      d += `<table style="width:100%;border-collapse:collapse;font-size:.82em">`;
      d += `<thead><tr style="border-bottom:1.5px solid var(--border)">`;
      d += `<th style="text-align:left;padding:5px 6px;color:var(--txt3);font-weight:600;font-size:.78em;text-transform:uppercase;letter-spacing:.4px">Spiel</th>`;
      d += `<th style="text-align:center;padding:5px 6px;color:var(--txt3);font-weight:600;font-size:.78em;text-transform:uppercase;letter-spacing:.4px">Resultat</th>`;
      d += `<th style="text-align:center;padding:5px 6px;color:var(--txt3);font-weight:600;font-size:.78em;text-transform:uppercase;letter-spacing:.4px">Tipp</th>`;
      d += `<th style="text-align:center;padding:5px 6px;color:var(--txt3);font-weight:600;font-size:.78em;text-transform:uppercase;letter-spacing:.4px">Pkt</th>`;
      d += `</tr></thead><tbody>`;
      s.matches.forEach(m => {
        const tA = TEAMS[m.hid], tB = TEAMS[m.aid];
        const rowBg = m.pts===4?'rgba(52,199,89,.07)':m.pts===3?'rgba(28,110,243,.06)':m.pts===2?'rgba(240,156,0,.07)':'';
        d += `<tr style="border-bottom:1px solid var(--bg4);background:${rowBg}">`;
        d += `<td style="padding:6px 6px">${tA.flag} <span style="font-weight:500">${tA.name}</span> <span style="color:var(--txt3);margin:0 3px">–</span> ${tB.flag} <span style="font-weight:500">${tB.name}</span></td>`;
        d += `<td style="padding:6px 6px;text-align:center;font-weight:700;font-size:.95em">${m.realA}:${m.realB}</td>`;
        d += `<td style="padding:6px 6px;text-align:center;color:var(--txt2)">${m.tipA}:${m.tipB}</td>`;
        d += `<td style="padding:6px 6px;text-align:center">${ptsBadge(m.pts)}</td>`;
        d += `</tr>`;
      });
      d += `</tbody></table></div>`;
      return d;
    };
    h += `<div style="margin-bottom:20px">`;
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">`;
    h += `<h3 style="font-weight:700;font-size:.9em;color:var(--txt)">🏆 Modell-Scoring</h3>`;
    h += `<span style="font-size:.72em;color:var(--txt3)">${totalLocked} gesperrte Spiele · max. ${maxPts} Punkte</span>`;
    h += `</div>`;
    h += `<div style="display:flex;gap:10px;flex-wrap:wrap">`;
    h += scoreCard('Elo-Modell',    '📐', sElo,   'var(--txt)',  'Kalibrierter Tipp via Elo-Differenz',             'elo');
    h += scoreCard('PowerProfile',  '⚡', sPP,    'var(--blue)', 'Kalibrierter Tipp mit Tempo/Balance-Korrektur',   'pp');
    h += scoreCard('Top-Tipp (PP)', '🔝', sTopPP, '#f09c00',    'Roh-wahrscheinlichstes Ergebnis laut PP-Poisson', 'toppp');
    h += `</div>`;
    // Detail-Panel unter den Karten (volle Breite, kein Overflow-Problem)
    if(activeScoringModel==='elo')   h += detailPanel(sElo,   'var(--txt)',  '📐 Elo-Modell');
    if(activeScoringModel==='pp')    h += detailPanel(sPP,    'var(--blue)', '⚡ PowerProfile');
    if(activeScoringModel==='toppp') h += detailPanel(sTopPP, '#f09c00',    '🔝 Top-Tipp (PP)');
    h += `</div>`;
  }
  // ──────────────────────────────────────────────────────────────────────────

  h+=`<div class="overview-grid">`;
  for(let gi=0;gi<12;gi++){
    const tb = overviewLockedOnly ? calcTableLocked(gi) : calcTable(gi);
    let locked=0; for(let i=0;i<6;i++){const r=results[`g${gi}_m${i}`];if(r&&r.locked)locked++}
    h+=`<div class="overview-card" data-goto="${GN[gi]}">`;
    h+=`<h4>Gruppe ${GN[gi]} <span style="font-weight:400;font-size:.82em;color:var(--txt3)">${locked}/6 ✅</span></h4>`;
    tb.forEach((t,i)=>{
      const cls=i===0?'first':i===1?'second':i===2?'third':'fourth';
      const goalStr=overviewLockedOnly
        ? (t.played>0?`<span style="color:var(--txt3);font-size:.72em">${t.gf}:${t.ga}</span>`:'')
        : `<span style="color:var(--txt3);font-size:.72em">${t.gf}:${t.ga}</span>`;
      h+=`<div class="overview-team ${cls}">`;
      h+=`<span style="min-width:14px">${i+1}.</span>`;
      h+=`<span style="font-size:1em">${TEAMS[t.id].flag}</span>`;
      h+=`<span style="flex:1">${TEAMS[t.id].name}</span>`;
      h+=`${goalStr}`;
      h+=`<span class="overview-elo">${t.pts}P</span>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  h+=`<h3 style="color:var(--gold);margin:24px 0 12px">Prognostizierte Gruppensieger</h3>`;
  h+=`<div style="display:flex;flex-wrap:wrap;gap:8px">`;
  for(let gi=0;gi<12;gi++){
    const w=TEAMS[calcTable(gi)[0].id];
    h+=`<div style="background:var(--bg2);border:1px solid var(--green);border-radius:var(--radius);padding:8px 14px;font-size:.88em">`;
    h+=`<span style="color:var(--txt3)">Gr.${GN[gi]}:</span> ${w.flag} <strong>${w.name}</strong></div>`;
  }
  h+=`</div>`;

  // Beste Drittplatzierte — nach FIFA-Slot-Zuteilung
  h+=`<h3 style="font-weight:700;margin:24px 0 8px;font-size:.95em">🏅 Qualifizierte Drittplatzierte</h3>`;
  h+=`<p style="color:var(--txt2);font-size:.78em;margin-bottom:10px">8 Drittplatzierte kommen weiter — je nach FIFA-Zuteilung der besten Dritten aus bestimmten Gruppen-Pools.</p>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px">`;
  const assignments = getThirdAssignments();
  KO_BRACKET.filter(m=>m.round==='r32').forEach(m=>{
    [m.slotA,m.slotB].forEach((slot,si)=>{
      if(slot.src!=='grp3') return;
      const key = m.id+'_'+si;
      const teamId = assignments.get(key);
      const team = teamId!=null ? TEAMS[teamId] : null;
      const allT = getAllThirds();
      const tData = allT.find(t=>t.teamId===teamId);
      const oppSlot = m.slotA===slot ? m.slotB : m.slotA;
      const oppTeamId = oppSlot.src==='grp' ? calcTable(GN.indexOf(oppSlot.g))[0]?.id : null;
      const opp = oppTeamId!=null ? TEAMS[oppTeamId] : null;
      h+=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow-sm);font-size:.82em">`;
      h+=`<div style="color:var(--txt3);font-size:.68em;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${m.label} · Pool: ${slot.groups.join('/')}</div>`;
      if(team){
        h+=`<div style="font-weight:700">${team.flag} ${team.name} <span style="color:var(--green);font-weight:400">${tData?tData.pts+'P '+(tData.gd>0?'+':'')+tData.gd+'TD':''}</span></div>`;
      } else {
        h+=`<div style="color:var(--txt3);font-style:italic">Noch offen</div>`;
      }
      if(opp) h+=`<div style="color:var(--txt3);font-size:.75em;margin-top:2px">vs. ${opp.flag} ${opp.name} (1. Gr.${oppSlot.g})</div>`;
      h+=`</div>`;
    });
  });
  h+=`</div>`;

  // Globale Rangliste aller 12 Dritten
  const allThirds=getAllThirds();
  const assignedTeams=new Set(assignments.values());
  h+=`<h3 style="font-weight:700;margin:20px 0 8px;font-size:.9em;color:var(--txt2)">Alle 12 Drittplatzierten im Vergleich</h3>`;
  h+=`<div style="max-width:500px"><table style="width:100%;border-collapse:collapse;font-size:.8em">`;
  h+=`<thead><tr style="border-bottom:1.5px solid var(--border)">`;
  ['#','Team','Gr.','Pkt','TD','Tore'].forEach(l=>
    h+=`<th style="padding:5px 7px;text-align:${l==='Team'?'left':'center'};color:var(--txt3);font-size:.68em;text-transform:uppercase">${l}</th>`
  );
  h+=`</tr></thead><tbody>`;
  allThirds.forEach((t,i)=>{
    const qualified=assignedTeams.has(t.teamId);
    const bg=qualified?'rgba(52,199,89,.05)':'';
    h+=`<tr style="border-bottom:1px solid var(--bg4);background:${bg}">`;
    h+=`<td style="padding:5px 7px;text-align:center;font-weight:700;color:${qualified?'var(--green)':'var(--txt3)'}">${i+1}</td>`;
    h+=`<td style="padding:5px 7px">${TEAMS[t.teamId].flag} ${TEAMS[t.teamId].name}${qualified?'<span style="color:var(--green);margin-left:4px;font-size:.75em">✓</span>':''}</td>`;
    h+=`<td style="padding:5px 7px;text-align:center;color:var(--txt3)">${t.g}</td>`;
    h+=`<td style="padding:5px 7px;text-align:center;font-weight:600">${t.pts}</td>`;
    h+=`<td style="padding:5px 7px;text-align:center">${t.gd>0?'+':''}${t.gd}</td>`;
    h+=`<td style="padding:5px 7px;text-align:center">${t.gf}</td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

function renderKO(){
  let h=`<h2 style="color:var(--gold);margin-bottom:6px">K.o.-Phase — Turnierbaum</h2>`;
  h+=`<div class="actions" style="margin-bottom:12px"><button class="btn btn-outline" id="clearKO" style="margin-left:4px">🗑 Alle KO-Tipps löschen</button></div>`;
  h+=`<p style="color:var(--txt2);font-size:.82em;margin-bottom:16px">
    🔮 Prognose (grau) · ✅ Gespielt/gesperrt (grün) · ⏳ Teams noch nicht bekannt (ausgegraut)<br>
    Ergebnis = nach 90 Min. (+ evtl. Verlängerung). Bei Elfmeterschiessen: Sieger separat markieren.
  </p>`;

  const rounds=['r32','r16','qf','sf','3p','final'];
  for(const round of rounds){
    const matches=KO_BRACKET.filter(m=>m.round===round);
    h+=`<div class="ko-round">`;
    h+=`<div class="ko-round-title"><span>${KO_ROUND_LABELS[round]}</span><span style="font-weight:400">${KO_ROUND_DATES[round]}</span></div>`;
    for(const m of matches){
      h+=renderKOCard(m);
    }
    h+=`</div>`;
  }
  return h;
}

function renderKOCard(m){
  const tAid=resolveSlot(m.slotA);
  const tBid=resolveSlot(m.slotB);
  const tA=tAid!==null?TEAMS[tAid]:null;
  const tB=tBid!==null?TEAMS[tBid]:null;
  const kr=koResults[m.id]||{goalsA:'',goalsB:'',locked:false,pens:null};
  const isLocked=kr.locked;
  const isPending=!tA||!tB;
  const cardCls=isLocked?'is-locked':isPending?'is-pending':'is-prediction';

  let h=`<div class="ko-card ${cardCls}">`;

  const pred = koPredictions[m.id] || null;
  const dispAid = tAid !== null ? tAid : (pred ? pred.teamA : null);
  const dispBid = tBid !== null ? tBid : (pred ? pred.teamB : null);
  const dispA = dispAid !== null ? TEAMS[dispAid] : null;
  const dispB = dispBid !== null ? TEAMS[dispBid] : null;
  const hasPred = pred !== null;
  const isKnown = dispA && dispB;

  // Ext prediction (only when teams are known)
  const predExt = (isKnown && dispAid !== null && dispBid !== null)
    ? predictMatchExt(dispAid, dispBid) : null;

  // Status badge
  if(isLocked)      h+=`<div class="ko-status real">✅ Gespielt · ${m.label} · ${m.date}</div>`;
  else if(isKnown)  h+=`<div class="ko-status pred">🔮 Prognose · ${m.label} · ${m.date}</div>`;
  else              h+=`<div class="ko-status pred">⏳ ${m.label} · ${m.date}</div>`;

  // Teams row
  h+=`<div class="ko-card-teams">`;
  if(dispA) h+=`<div class="ko-card-team">${dispA.flag} ${dispA.name}</div>`;
  else h+=`<div class="ko-card-team tbd">${slotLabel(m.slotA)}</div>`;

  h+=`<div class="ko-score-center">`;
  if(isLocked){
    h+=`<div class="ko-score-disp real">${kr.goalsA}<span style="color:var(--txt3);font-weight:400">:</span>${kr.goalsB}</div>`;
    if(kr.pens) h+=`<div class="ko-winner-badge">🎯 n.E. ${kr.pens==='A'?dispA?.name:dispB?.name} weiter</div>`;
  } else if(hasPred){
    h+=`<div class="ko-score-disp pred" style="font-size:.9em">vs</div>`;
  } else {
    h+=`<div class="ko-score-disp pred" style="font-size:.9em">?:?</div>`;
  }
  h+=`</div>`;

  if(dispB) h+=`<div class="ko-card-team away">${dispB.name} ${dispB.flag}</div>`;
  else h+=`<div class="ko-card-team away tbd">${slotLabel(m.slotB)}</div>`;
  h+=`</div>`;

  // Dual predictions (when not locked and teams known)
  if(!isLocked && isKnown && hasPred){
    const changed = predExt && (pred.goalsA!==predExt.goalsA || pred.goalsB!==predExt.goalsB);
    h+=`<div class="pred-cols" style="margin-top:8px">`;

    h+=`<div class="pred-col">`;
    h+=`<div class="pred-col-label">Elo-Modell</div>`;
    h+=`<div class="pred-col-score">${pred.goalsA}<span class="sep">:</span>${pred.goalsB}</div>`;
    h+=`<div class="pred-col-meta"><span>S ${(pred.pW*100).toFixed(0)}%</span><span>U ${(pred.pD*100).toFixed(0)}%</span><span>N ${(pred.pL*100).toFixed(0)}%</span></div>`;
    h+=`<button class="pred-take-btn" data-ko="${m.id}" data-a="${pred.goalsA}" data-b="${pred.goalsB}">↙ Übernehmen</button>`;
    h+=`</div>`;

    h+=`<div class="pred-divider"></div>`;

    h+=`<div class="pred-col pred-col-ext">`;
    h+=`<div class="pred-col-label">Modell-Tipp</div>`;
    if(predExt){
      h+=`<div class="pred-col-score ${changed?'pred-col-score-diff':''}">${predExt.goalsA}<span class="sep">:</span>${predExt.goalsB}</div>`;
      h+=`<div class="pred-col-meta"><span>S ${(predExt.pW*100).toFixed(0)}%</span><span>U ${(predExt.pD*100).toFixed(0)}%</span><span>N ${(predExt.pL*100).toFixed(0)}%</span></div>`;
      h+=`<div class="pred-col-detail">λ ${predExt.lA.toFixed(2)} – ${predExt.lB.toFixed(2)}</div>`;
      h+=`<div class="pred-col-detail">Top: ${predExt.topScores}</div>`;
      h+=`<button class="pred-take-btn pred-take-ext" data-ko="${m.id}" data-a="${predExt.goalsA}" data-b="${predExt.goalsB}">↙ Übernehmen</button>`;
    }else{
      h+=`<div class="pred-col-score" style="font-size:1em;color:var(--txt3)">–</div>`;
    }
    h+=`</div>`;
    h+=`</div>`; // pred-cols
  }

  // Input row
  if(!isLocked&&isKnown){
    const vA=kr.goalsA!==''?String(kr.goalsA):'';
    const vB=kr.goalsB!==''?String(kr.goalsB):'';
    const canLock=vA!==''&&vB!=='';
    const isDraw=canLock&&parseInt(vA)===parseInt(vB);
    h+=`<div class="ko-input-row">`;
    h+=`<label style="font-size:.75em;color:var(--txt3);white-space:nowrap;font-weight:500">Eigener Tipp:</label>`;
    h+=`<input type="number" min="0" max="20" value="${vA}" data-ko="${m.id}" data-side="A" class="${vA!==''?'filled':''}" placeholder="–">`;
    h+=`<span class="sep">:</span>`;
    h+=`<input type="number" min="0" max="20" value="${vB}" data-ko="${m.id}" data-side="B" class="${vB!==''?'filled':''}" placeholder="–">`;
    h+=`<button class="btn-lock lock" data-ko="${m.id}" ${canLock?'':'disabled'}>🔒 Sperren</button>`;
    h+=`</div>`;
    if(isDraw){
      const pens=kr.pens||'';
      h+=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:.8em">`;
      h+=`<span style="color:var(--txt2)">n.E. weiter:</span>`;
      h+=`<button class="btn-pens ${pens==='A'?'active':''}" data-ko="${m.id}" data-pens="A" style="padding:3px 10px;border-radius:6px;border:1px solid ${pens==='A'?'var(--green)':'var(--border)'};background:${pens==='A'?'rgba(52,199,89,.15)':'transparent'};color:${pens==='A'?'var(--green)':'var(--txt2)'}">`;
      h+=`${dispA.flag} ${dispA.name}</button>`;
      h+=`<button class="btn-pens ${pens==='B'?'active':''}" data-ko="${m.id}" data-pens="B" style="padding:3px 10px;border-radius:6px;border:1px solid ${pens==='B'?'var(--green)':'var(--border)'};background:${pens==='B'?'rgba(52,199,89,.15)':'transparent'};color:${pens==='B'?'var(--green)':'var(--txt2)'}">`;
      h+=`${dispB.flag} ${dispB.name}</button>`;
      h+=`</div>`;
    }
  }

  if(isLocked){
    h+=`<div class="pred-was">`;
    if(pred) h+=`Elo: ${pred.goalsA}:${pred.goalsB}`;
    if(pred&&predExt) h+=` · Stärken: ${predExt.goalsA}:${predExt.goalsB}`;
    h+=`</div>`;
    h+=`<div style="text-align:center;margin-top:8px"><button class="btn-lock unlock" data-ko="${m.id}">🔓 Entsperren</button></div>`;
  }

  h+=`</div>`;
  return h;
}

function renderTeamRatings(){
  let h=`<h2 style="font-weight:700;letter-spacing:-.2px;margin-bottom:4px">🎯 Team-Profile</h2>`;
  h+=`<p style="color:var(--txt2);font-size:.82em;margin-bottom:6px"><strong>GoalRate</strong> steuert nur, ob Spiele eines Teams eher torreich oder torarm werden. <strong>Balance</strong> verschiebt den Toranteil leicht zugunsten/zulasten des Teams. Elo bleibt die eigentliche Stärke.</p>`;
  h+=`<div class="info-box" style="margin-bottom:12px;font-size:.78em">`;
  h+=`🔄 <strong>Auto-Update:</strong> Nach gesperrten Spielen lernt GoalRate aus Gesamt-Toren vs. Erwartung und Balance aus Toranteil vs. Erwartung. Gegnerstärke steckt bereits in λ vor dem Spiel.`;
  h+=`</div>`;
  h+=`<div class="actions"><button class="btn btn-outline" id="resetRatings">Auf Standardprofile zurücksetzen</button></div>`;
  h+=`<div class="elo-grid">`;
  TEAMS.forEach(t=>{
    const rt=TEAM_RATINGS[t.id];
    const dr=DEFAULT_RATINGS[t.id];
    const dGoal=rt.goalRate-dr.goalRate, dBal=rt.balance-dr.balance;
    const fmtDelta=(d)=>d>0.005?`<span style="color:var(--green);font-size:.65em">▲${d.toFixed(2)}</span>`:
                        d<-0.005?`<span style="color:var(--red);font-size:.65em">▼${Math.abs(d).toFixed(2)}</span>`:
                        `<span style="color:var(--txt3);font-size:.65em">±0</span>`;
    h+=`<div class="elo-item">`;
    h+=`<span class="flag">${t.flag}</span>`;
    h+=`<span style="flex:1;font-size:.85em">${t.name}</span>`;
    h+=`<div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end">`;
    h+=`<div style="display:flex;align-items:center;gap:4px">`;
    h+=`<span style="font-size:.65em;color:var(--txt3);width:48px;text-align:right">GoalRate</span>`;
    h+=`${fmtDelta(dGoal)}`;
    h+=`<input type="number" step="0.01" min="0.85" max="1.18" value="${rt.goalRate.toFixed(2)}" data-rating="${t.id}" data-field="goalRate" style="width:56px">`;

function genExport(){
  let L=['WM 2026 TIPPSPIEL — Stand: '+new Date().toLocaleString('de-CH'),''];
  for(let gi=0;gi<12;gi++){
    L.push(`── Gruppe ${GN[gi]} ──`);
    const tids=GROUPS[gi];
    for(let md=0;md<3;md++){
      for(let mi=0;mi<2;mi++){
        const[hi,ai]=MATCH_PAIRS[gi][md][mi];
        const hid=tids[hi],aid=tids[ai];
        const key=`g${gi}_m${md*2+mi}`;
        const r=results[key];
        const pr=predictMatch(hid,aid);
        let ln=`  ${TEAMS[hid].name} – ${TEAMS[aid].name}: `;
        if(r&&r.locked){
          ln+=`${r.goalsA}:${r.goalsB} ✅`;
        } else if(r&&r.goalsA!==''&&r.goalsB!==''){
          ln+=`${r.goalsA}:${r.goalsB} ✏️ (Elo-Prognose: ${pr.goalsA}:${pr.goalsB})`;
        } else {
          ln+=`${pr.goalsA}:${pr.goalsB} 🔮 (Prognose)`;
        }
        L.push(ln);
      }
    }
    const tb=calcTable(gi);
    L.push(`  → ${tb.map((t,i)=>`${i+1}.${TEAMS[t.id].name}(${t.pts}P)`).join(' | ')}`);
    L.push('');
  }
  return L.join('\n');
}

// Match key lookup: [teamIdA, teamIdB] → "g{gi}_m{mi}"
function buildMatchKeyMap(){
  const map={};
  for(let gi=0;gi<12;gi++){
    const tids=GROUPS[gi];
    for(let md=0;md<3;md++){
      for(let mi=0;mi<2;mi++){
        const[hi,ai]=MATCH_PAIRS[gi][md][mi];
        const key=`g${gi}_m${md*2+mi}`;
        const pair=[tids[hi],tids[ai]].sort((a,b)=>a-b).join('_');
        map[pair]=key;
      }
    }
  }
  return map;
}

let updateLog=[];

async function apiUpdateResults(){
  if(apiUpdating)return;
  apiUpdating=true;
  updateLog=[];
  apiStatus='loading';
  apiStatusMsg='Lade Spiele von football-data.org...';
  render();

  try{
    const data=await apiFetchAllMatches();
    const matches=data.matches||[];
    const mkMap=buildMatchKeyMap();
    let newCount=0, skipCount=0, warnCount=0;

    const groupMatches=matches.filter(m=>m.stage==='GROUP_STAGE'||m.group);

    for(const m of groupMatches){
      const status=m.status; // FINISHED, IN_PLAY, TIMED, SCHEDULED
      if(status!=='FINISHED') continue;

      const hName=m.homeTeam?.name||'';
      const aName=m.awayTeam?.name||'';
      const hId=FD_NAME_MAP[hName];
      const aId=FD_NAME_MAP[aName];

      if(hId===undefined||aId===undefined){
        updateLog.push({type:'warn',msg:`Unbekannte Teams: "${hName}" vs "${aName}"`});
        warnCount++;
        continue;
      }

      const pair=[hId,aId].sort((a,b)=>a-b).join('_');
      const matchKey=mkMap[pair];
      if(!matchKey){
        updateLog.push({type:'warn',msg:`Kein Match-Key für ${TEAMS[hId].name} vs ${TEAMS[aId].name}`});
        warnCount++;
        continue;
      }

      const gA=m.score?.fullTime?.home??null;
      const gB=m.score?.fullTime?.away??null;
      if(gA===null||gB===null) continue;

      // Check if home/away order matches our internal order
      const parts=matchKey.split('_');
      const gi=parseInt(parts[0].slice(1));
      const mi=parseInt(parts[1].slice(1));
      const md=Math.floor(mi/2);
      const mmi=mi%2;
      const [internalHi,internalAi]=MATCH_PAIRS[gi][md][mmi];
      const internalH=GROUPS[gi][internalHi];
      const internalA=GROUPS[gi][internalAi];

      // Swap goals if API home/away doesn't match internal order
      let finalA,finalB;
      if(internalH===hId){finalA=gA;finalB=gB;}
      else{finalA=gB;finalB=gA;}

      const existing=results[matchKey];
      if(existing&&existing.locked&&existing.goalsA===finalA&&existing.goalsB===finalB){
        skipCount++;
        updateLog.push({type:'skip',msg:`${TEAMS[internalH].name} ${finalA}:${finalB} ${TEAMS[internalA].name} (bereits gesperrt)`});
      } else {
        const isNew=!existing||!existing.locked;
        results[matchKey]={goalsA:finalA,goalsB:finalB,locked:true};
        newCount++;
        updateLog.push({type:'new',msg:`${TEAMS[internalH].flag} ${TEAMS[internalH].name} ${finalA}:${finalB} ${TEAMS[internalA].name} ${TEAMS[internalA].flag}${isNew?'  ✅ NEU':'  🔄 Aktualisiert'}`});
      }
    }

    recalcAllElos();
    apiLastUpdate=new Date().toLocaleString('de-CH');
    apiStatus='ok';
    const played=groupMatches.filter(m=>m.status==='FINISHED').length;
    apiStatusMsg=`✅ ${played}/72 Gruppenspiele gespielt · ${newCount} neu/aktualisiert · ${skipCount} unverändert${warnCount>0?` · ⚠ ${warnCount} Warnungen`:''}`;

    if(newCount>0){
      updateLog.unshift({type:'new',msg:`🎉 ${newCount} Ergebnis(se) neu eingetragen und gesperrt!`});
    }else{
      updateLog.unshift({type:'skip',msg:`ℹ Alle bekannten Ergebnisse waren bereits aktuell.`});
    }

  }catch(e){
    apiStatus='error';
    apiStatusMsg=`❌ Fehler: ${e.message}`;
    updateLog=[{type:'err',msg:e.message}];
  }

  apiUpdating=false;
  render();
}

// Twemoji-Bilder für Canvas (Turnierbaum). twemoji.parse() wirkt nur auf HTML, nicht auf <canvas>.
const FLAG_CANVAS_CACHE = {};
function flagToTwemojiUrl(flag){
  if(!flag) return null;
  let code = null;
  if(window.twemoji && twemoji.convert && twemoji.convert.toCodePoint){
    code = twemoji.convert.toCodePoint(flag);
  } else {
    code = Array.from(flag).map(ch => ch.codePointAt(0).toString(16)).join('-');
  }
  return `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${code}.svg`;
}
function getCanvasFlagImage(flag){
  const url = flagToTwemojiUrl(flag);
  if(!url) return null;
  if(FLAG_CANVAS_CACHE[url]) return FLAG_CANVAS_CACHE[url];
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { if(activeTab === 'bracket') renderBracket(); };
  img.src = url;
  FLAG_CANVAS_CACHE[url] = img;
  return img;
}
