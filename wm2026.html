<html lang="de">

<title>WM 2026 Tippspiel Simulator v2</title>
<style>
:root {
  --bg: #0b1222; --bg2: #131d33; --bg3: #1a2744; --bg4: #22325a;
  --gold: #d4a843; --gold2: #b8922e; --green: #27ae60; --green2: #1e8449;
  --red: #e74c3c; --blue: #3498db;
  --txt: #e8eaf0; --txt2: #9aa3b8; --txt3: #5d6a85;
  --border: #1e2d4a; --radius: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input[type=number]{font-family:inherit;-moz-appearance:textfield;-webkit-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0;display:none}

.header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:2px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:1.25em;color:var(--gold);font-weight:700;letter-spacing:.5px}
.header h1 span{color:var(--txt2);font-weight:400;font-size:.7em;display:block}
.tabs{display:flex;gap:2px;background:var(--bg2);padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.tab{padding:7px 12px;border:none;background:transparent;color:var(--txt2);font-size:.82em;font-weight:600;border-radius:var(--radius) var(--radius) 0 0;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--txt);background:var(--bg3)}
.tab.active{color:var(--gold);background:var(--bg3);border-bottom:2px solid var(--gold)}
.main{max-width:900px;margin:0 auto;padding:16px}

.params-toggle{background:var(--bg3);border:1px solid var(--border);color:var(--gold);padding:8px 16px;border-radius:var(--radius);font-size:.85em;width:100%;text-align:left;margin-bottom:12px}
.params-toggle:hover{background:var(--bg4)}
.params-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:none}
.params-panel.open{display:block}
.params-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.param-item{display:flex;flex-direction:column;gap:4px}
.param-item label{font-size:.72em;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.param-item input{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:6px 10px;border-radius:4px;font-size:.9em;width:100%}
.param-item input:focus{outline:none;border-color:var(--gold)}

.group-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.group-header h2{font-size:1.15em;color:var(--gold)}
.matchday{margin-bottom:24px}
.matchday-title{font-size:.78em;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.matchday-title .md-date{color:var(--txt3);font-weight:400;font-size:.9em}

/* Match Card */
.match-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;position:relative;transition:all .2s}
.match-card.is-locked{border-color:var(--green);border-left:4px solid var(--green);background:linear-gradient(135deg,rgba(39,174,96,.06),var(--bg2))}
.match-card.is-prediction{border-left:4px solid var(--bg4)}

.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:8px}
.match-team{display:flex;align-items:center;gap:8px;font-size:.9em;font-weight:600}
.match-team.away{justify-content:flex-end;text-align:right}
.match-team .flag{font-size:1.3em}

.match-status{display:flex;align-items:center;gap:6px;font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.match-status.prediction{color:var(--txt3)}
.match-status.played{color:var(--green)}

.match-score-display{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.6em;font-weight:800;letter-spacing:2px;min-height:40px}
.match-score-display.is-pred{color:var(--txt3);font-weight:600}
.match-score-display.is-played{color:var(--green)}
.match-score-display .sep{color:var(--txt3);font-weight:400}

.match-meta{text-align:center;font-size:.72em;color:var(--txt3);margin-top:4px}
.match-meta .prob{margin-right:8px}

.match-input-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.match-input-row label{font-size:.75em;color:var(--txt2);white-space:nowrap}
.match-input-row input{width:40px;height:34px;text-align:center;background:var(--bg);border:2px solid var(--border);color:var(--txt);border-radius:6px;font-size:1.05em;font-weight:700;transition:border-color .15s}
.match-input-row input:focus{outline:none;border-color:var(--gold)}
.match-input-row input.filled{border-color:var(--blue);background:rgba(52,152,219,.08)}
.match-input-row .sep{color:var(--txt3);font-weight:700;font-size:1.1em}

.btn-lock{padding:6px 14px;border:none;border-radius:6px;font-size:.78em;font-weight:700;transition:all .15s;display:flex;align-items:center;gap:4px}
.btn-lock.lock{background:var(--green);color:#fff}
.btn-lock.lock:hover{background:var(--green2)}
.btn-lock.lock:disabled{background:var(--bg4);color:var(--txt3);cursor:not-allowed}
.btn-lock.unlock{background:transparent;border:1px solid var(--border);color:var(--txt3)}
.btn-lock.unlock:hover{border-color:var(--red);color:var(--red)}

.pred-was{text-align:center;font-size:.72em;color:var(--txt3);margin-top:4px;font-style:italic}

/* Group Table */
.group-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.82em}
.group-table th{text-align:left;padding:8px 10px;color:var(--txt2);font-size:.72em;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
.group-table th.num{text-align:center}
.group-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.group-table td.num{text-align:center}
.group-table tr.q1 td{background:rgba(39,174,96,.1)}
.group-table tr.q2 td{background:rgba(39,174,96,.05)}
.group-table tr.q3 td{background:rgba(212,168,67,.06)}
.group-table .team-cell{display:flex;align-items:center;gap:8px}
.group-table .pos{color:var(--txt3);font-weight:700;width:18px}
.legend{display:flex;gap:16px;margin-top:8px;font-size:.68em;color:var(--txt3);flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.legend .l1::before{background:rgba(39,174,96,.35)}
.legend .l2::before{background:rgba(39,174,96,.18)}
.legend .l3::before{background:rgba(212,168,67,.25)}

/* Overview */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.overview-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:border-color .15s}
.overview-card:hover{border-color:var(--gold)}
.overview-card h4{color:var(--gold);font-size:.85em;margin-bottom:8px}
.overview-team{display:flex;align-items:center;gap:6px;font-size:.82em;padding:3px 0}
.overview-team.first{font-weight:700;color:var(--green)}
.overview-team.second{color:var(--txt)}
.overview-team.third{color:var(--txt2)}
.overview-team.fourth{color:var(--txt3)}
.overview-elo{margin-left:auto;font-size:.75em;color:var(--txt3)}
.overview-stats{display:flex;gap:8px;margin-top:8px;font-size:.7em;color:var(--txt3)}

/* KO */
.ko-section{margin-bottom:24px}
.ko-section h3{color:var(--gold);font-size:.95em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.ko-match{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:.85em;flex-wrap:wrap}
.ko-match .vs{color:var(--txt3);margin:0 4px}
.ko-pred{margin-left:auto;color:var(--txt3);font-size:.85em;font-weight:600}

/* Elo Editor */
.elo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.elo-item{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-size:.85em}
.elo-item .flag{font-size:1.1em}
.elo-item input{width:60px;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:4px 6px;border-radius:4px;text-align:center;font-size:.85em;margin-left:auto}
.elo-item input:focus{outline:none;border-color:var(--gold)}
.elo-diff{font-size:.7em;width:40px;text-align:right}
.elo-diff.up{color:var(--green)}
.elo-diff.down{color:var(--red)}

.btn{padding:8px 16px;border:none;border-radius:var(--radius);font-size:.85em;font-weight:600;transition:all .15s}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-gold:hover{background:var(--gold2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--txt2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-red{background:var(--red);color:white}
.actions{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.export-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:monospace;font-size:.78em;color:var(--txt2);white-space:pre-wrap;max-height:400px;overflow-y:auto;margin-top:12px;user-select:all}
.info-box{background:rgba(52,152,219,.08);border:1px solid rgba(52,152,219,.25);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:.82em;color:var(--blue);line-height:1.5}

/* API Panel */
.api-section{margin-bottom:24px}
.api-section h3{color:var(--gold);font-size:.95em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.token-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.token-row input[type=text]{flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:var(--radius);font-family:monospace;font-size:.85em}
.token-row input[type=text]:focus{outline:none;border-color:var(--gold)}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:.8em;font-weight:700}
.status-badge.ok{background:rgba(39,174,96,.15);color:var(--green);border:1px solid var(--green)}
.status-badge.error{background:rgba(231,76,60,.15);color:var(--red);border:1px solid var(--red)}
.status-badge.loading{background:rgba(52,152,219,.15);color:var(--blue);border:1px solid var(--blue)}
.status-badge.idle{background:var(--bg3);color:var(--txt3);border:1px solid var(--border)}
.update-log{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;max-height:320px;overflow-y:auto;margin-top:12px}
.log-entry{padding:5px 0;border-bottom:1px solid var(--border);font-size:.8em;display:flex;gap:10px;align-items:flex-start}
.log-entry:last-child{border-bottom:none}
.log-entry .log-icon{flex-shrink:0}
.log-entry.new{color:var(--green)}
.log-entry.skip{color:var(--txt3)}
.log-entry.warn{color:var(--gold)}
.log-entry.err{color:var(--red)}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}

/* K.o. Phase */
.ko-round{margin-bottom:28px}
.ko-round-title{font-size:.78em;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;
  margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px}
.ko-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;transition:all .2s}
.ko-card.is-locked{border-color:var(--green);border-left:4px solid var(--green);
  background:linear-gradient(135deg,rgba(39,174,96,.06),var(--bg2))}
.ko-card.is-prediction{border-left:4px solid var(--bg4)}
.ko-card.is-pending{border-left:4px solid var(--border);opacity:.65}
.ko-card-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:6px}
.ko-card-team{display:flex;align-items:center;gap:6px;font-size:.88em;font-weight:600}
.ko-card-team.away{justify-content:flex-end;text-align:right}
.ko-card-team.tbd{color:var(--txt3);font-style:italic;font-weight:400}
.ko-score-center{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:100px}
.ko-score-disp{font-size:1.5em;font-weight:800;letter-spacing:2px}
.ko-score-disp.pred{color:var(--txt3);font-weight:500;font-size:1.1em}
.ko-score-disp.real{color:var(--green)}
.ko-status{font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.ko-status.pred{color:var(--txt3)}
.ko-status.real{color:var(--green)}
.ko-probs{font-size:.65em;color:var(--txt3);text-align:center}
.ko-input-row{display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.ko-input-row input{width:38px;height:32px;text-align:center;background:var(--bg);
  border:2px solid var(--border);color:var(--txt);border-radius:6px;font-size:1em;font-weight:700}
.ko-input-row input:focus{outline:none;border-color:var(--gold)}
.ko-input-row input.filled{border-color:var(--blue);background:rgba(52,152,219,.08)}
.ko-input-row .sep{color:var(--txt3);font-weight:700}
.ko-et-label{font-size:.7em;color:var(--txt3);margin-left:4px}
.ko-winner-badge{display:inline-flex;align-items:center;gap:4px;font-size:.72em;
  color:var(--gold);margin-top:4px;text-align:center}

/* Turnierbaum */
#bracketWrap{overflow-x:auto;overflow-y:hidden;padding:12px 0;cursor:grab;user-select:none}
#bracketWrap:active{cursor:grabbing}
#bracketCanvas{display:block;margin:0 auto}
.bracket-legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:.72em;color:var(--txt3)}
.bracket-legend span{display:flex;align-items:center;gap:4px}
.bracket-legend span::before{content:'';display:inline-block;width:12px;height:4px;border-radius:2px}
.bracket-legend .bl-pred::before{background:#3d5275}
.bracket-legend .bl-real::before{background:#27ae60}
.bracket-legend .bl-tbd::before{background:#1a2744}
</style>
</head>

// Resolve a slot to a team id (or null if not yet known)
// koOverride: optional temp results map used during auto-fill
// For PREDICTIONS: always resolve using calcTable (which uses predictions for unplayed games)
// Only return null for pos>=3 if we explicitly need confirmed results (not during auto-fill)
function resolveSlot(slot, koOverride){
  const KR = koOverride || koResults;
  if(slot.src==='grp'){
    const gi=GN.indexOf(slot.g);
    const tb=calcTable(gi); // calcTable already fills unplayed with predictions
    // For pos 1+2: always resolvable via predictions
    // For pos 3: also resolvable via predictions (we want to show something)
    return tb[slot.pos-1]?.id ?? null;
  } else {
    const kr=KR[slot.id];
    if(!kr||!kr.locked) return null;
    const m=KO_BRACKET.find(x=>x.id===slot.id);
    if(!m) return null;
    const tA=resolveSlot(m.slotA, KR), tB=resolveSlot(m.slotB, KR);
    if(tA===null||tB===null) return null;
    if(slot.w){
      if(kr.goalsA>kr.goalsB) return tA;
      if(kr.goalsB>kr.goalsA) return tB;
      if(kr.pens==='A') return tA;
      if(kr.pens==='B') return tB;
      return null;
    } else {
      if(kr.goalsA>kr.goalsB) return tB;
      if(kr.goalsB>kr.goalsA) return tA;
      if(kr.pens==='A') return tB;
      if(kr.pens==='B') return tA;
      return null;
    }
  }
}

function koWinnerTeam(matchId){
  const m=KO_BRACKET.find(x=>x.id===matchId);
  if(!m) return null;
  return resolveSlot({src:'ko',id:matchId,w:true});
}

function slotLabel(slot){
  if(slot.src==='grp'){
    const pos=['1.','2.','3.'][slot.pos-1]||`${slot.pos}.`;
    return `${pos} Gr. ${slot.g}`;
  }
  const m=KO_BRACKET.find(x=>x.id===slot.id);
  const rnd={r32:'R32',r16:'AF',qf:'VF',sf:'HF',final:'F','3p':'3P'}[m?.round]||'?';
  return slot.w?`Sieger ${rnd} ${m?.label||''}`:`Verlierer ${rnd} ${m?.label||''}`;
}

// ============================================================
// PRE-COMPUTE ALL KO PREDICTIONS (runs on every render)
// Builds a complete prediction map for all 31 KO matches,
// chaining round by round so each round feeds the next.
// ============================================================
let koPredictions = {}; // mid → {goalsA, goalsB, teamA, teamB}

function computeKOPredictions(){
  koPredictions = {};

  // resolveForPred: resolves a slot using koResults (locked real results)
  // OR koPredictions (computed predictions) as fallback
  function resolveForPred(slot){
    if(slot.src==='grp'){
      const gi=GN.indexOf(slot.g);
      return calcTable(gi)[slot.pos-1]?.id ?? null;
    }
    // src='ko': first check real locked result
    const kr=koResults[slot.id];
    if(kr&&kr.locked){
      // resolve from real result
      const m=KO_BRACKET.find(x=>x.id===slot.id);
      if(!m) return null;
      const tA=resolveForPred(m.slotA), tB=resolveForPred(m.slotB);
      if(tA===null||tB===null) return null;
      if(slot.w){
        if(kr.goalsA>kr.goalsB) return tA;
        if(kr.goalsB>kr.goalsA) return tB;
        if(kr.pens==='A') return tA;
        if(kr.pens==='B') return tB;
        return tA;
      } else {
        if(kr.goalsA>kr.goalsB) return tB;
        if(kr.goalsB>kr.goalsA) return tA;
        return tB;
      }
    }
    // fallback: use computed prediction
    const pred=koPredictions[slot.id];
    if(!pred) return null;
    if(slot.w) return pred.goalsA>=pred.goalsB ? pred.teamA : pred.teamB;
    else       return pred.goalsA>=pred.goalsB ? pred.teamB : pred.teamA;
  }

  const rounds=[
    ['r32_1','r32_2','r32_3','r32_4','r32_5','r32_6','r32_7','r32_8',
     'r32_9','r32_10','r32_11','r32_12','r32_13','r32_14','r32_15','r32_16'],
    ['r16_1','r16_2','r16_3','r16_4','r16_5','r16_6','r16_7','r16_8'],
    ['qf_1','qf_2','qf_3','qf_4'],
    ['sf_1','sf_2'],
    ['3p_1','final_1'],
  ];

  for(const roundMatches of rounds){
    for(const mid of roundMatches){
      const m=KO_BRACKET.find(x=>x.id===mid);
      if(!m) continue;
      // If already locked with real result, skip prediction
      if(koResults[mid]&&koResults[mid].locked) continue;
      const tAid=resolveForPred(m.slotA);
      const tBid=resolveForPred(m.slotB);
      if(tAid===null||tBid===null) continue;
      const pr=predictMatch(tAid,tBid);
      let gA=pr.goalsA, gB=pr.goalsB;
      // KO: no draws in predictions
      if(gA===gB){ if(pr.pW>=pr.pL) gA++; else gB++; }
      koPredictions[mid]={
        goalsA:gA, goalsB:gB,
        teamA:tAid, teamB:tBid,
        pW:pr.pW, pD:pr.pD, pL:pr.pL
      };
    }
  }
}

// ============================================================
// ENGINE — optimierte Defaults
// ============================================================
let P={baseGoals:1.33,eloFactor:380,hostBoost:65,homeBoost:0,kFactor:50};

function fac(n){let f=1;for(let i=2;i<=n;i++)f*=i;return f}
function ppf(k,l){return l<=0?(k===0?1:0):Math.pow(l,k)*Math.exp(-l)/fac(k)}

function effElo(id){return TEAMS[id].elo+(HOST_IDS.includes(id)?P.hostBoost:0)}

function predictMatch(idA,idB){
  const diff=(effElo(idA)-effElo(idB)+P.homeBoost)/P.eloFactor;
  const lA=Math.max(.15,P.baseGoals+diff/2);
  const lB=Math.max(.15,P.baseGoals-diff/2);
  let pW=0,pD=0,pL=0;
  for(let a=0;a<=7;a++)for(let b=0;b<=7;b++){
    const p=ppf(a,lA)*ppf(b,lB);
    if(a>b)pW+=p;else if(a===b)pD+=p;else pL+=p;
  }
  // Kategorie-basiertes Scoring: λ-Stärke → realistische Ergebnisse
  const strong=lA>=lB;
  const lS=Math.max(lA,lB), lW=Math.min(lA,lB), ld=lS-lW;
  // Tore Favorit
  let gS;
  if(lS<1.55)gS=1;
  else if(lS<2.05)gS=2;
  else if(lS<2.6)gS=3;
  else gS=Math.round(lS);
  // Tore Underdog
  let gW;
  if(lW<0.5)gW=0;
  else if(lW<0.85)gW=0;
  else gW=1;
  // Gleichstand auflösen
  if(gS===gW){
    if(ld>=0.3)gS++;                    // klarer Favorit → Sieg +2 (z.B. 2:1)
    else if(ld>=0.1)gW=Math.max(0,gW-1);// leichter Favorit → Sieg +1 (z.B. 1:0)
    // sonst: Unentschieden (ld<0.1, sehr ausgeglichen)
  }
  const gA=strong?gS:gW, gB=strong?gW:gS;
  const pExact=ppf(gA,lA)*ppf(gB,lB);
  return{goalsA:gA,goalsB:gB,lA,lB,pW,pD,pL,pExact};
}

function updateEloSingle(idA,idB,gA,gB){
  const eA=TEAMS[idA].elo,eB=TEAMS[idB].elo;
  const exA=1/(1+Math.pow(10,(eB-eA)/400));
  const act=gA>gB?1:(gA===gB?.5:0);
  const d=P.kFactor*(act-exA);
  TEAMS[idA].elo=Math.round(eA+d);
  TEAMS[idB].elo=Math.round(eB-d);
}

// Alle Elos ab Basis neu berechnen basierend auf gesperrten Resultaten
function recalcAllElos(){
  TEAMS.forEach(t=>t.elo=t.base);
  for(let md=0;md<3;md++){
    for(let gi=0;gi<12;gi++){
      for(let mi=0;mi<2;mi++){
        const k=`g${gi}_m${md*2+mi}`;
        const r=results[k];
        if(r&&r.locked){
          const tids=GROUPS[gi];
          const[hi,ai]=MDS[md][mi];
          updateEloSingle(tids[hi],tids[ai],r.goalsA,r.goalsB);
        }
      }
    }
  }
}

// ============================================================
// TABLE
// ============================================================
function calcTable(gi){
  const tids=GROUPS[gi];
  const tb=tids.map(id=>({id,pts:0,gf:0,ga:0,gd:0,w:0,d:0,l:0,played:0}));
  const lk={};tids.forEach((id,i)=>lk[id]=i);

  for(let md=0;md<3;md++){
    for(let mi=0;mi<2;mi++){
      const key=`g${gi}_m${md*2+mi}`;
      const[hi,ai]=MDS[md][mi];
      const hid=tids[hi],aid=tids[ai];
      const r=results[key];
      let gA,gB,isReal=false;
      if(r&&r.locked){gA=r.goalsA;gB=r.goalsB;isReal=true}
      else{const p=predictMatch(hid,aid);gA=p.goalsA;gB=p.goalsB}
      const h=tb[lk[hid]],a=tb[lk[aid]];
      h.gf+=gA;h.ga+=gB;a.gf+=gB;a.ga+=gA;
      if(isReal){h.played++;a.played++}
      if(gA>gB){h.w++;h.pts+=3;a.l++}
      else if(gA===gB){h.d++;h.pts+=1;a.d++;a.pts+=1}
      else{a.w++;a.pts+=3;h.l++}
    }
  }
  tb.forEach(t=>t.gd=t.gf-t.ga);
  tb.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return tb;
}

function render(){
  recalcAllElos();
  computeKOPredictions();
  renderTabs();
  const m=document.getElementById('main');
  if(activeTab==='overview')m.innerHTML=renderOverview();
  else if(activeTab==='knockout')m.innerHTML=renderKO();
  else if(activeTab==='elo')m.innerHTML=renderElo();
  else if(activeTab==='bracket'){m.innerHTML=renderBracketPage();renderBracket();}
  else if(activeTab==='api')m.innerHTML=renderAPI();
  else if(activeTab==='export')m.innerHTML=renderExport();
  else{const gi=GN.indexOf(activeTab);if(gi>=0)m.innerHTML=renderGroup(gi)}
  bind();save();
}

function renderTabs(){
  const t=document.getElementById('tabs');
  const items=[{id:'overview',l:'📊 Übersicht'},...GN.map(g=>({id:g,l:`Gr. ${g}`})),
    {id:'knockout',l:'🏆 K.o.'},{id:'bracket',l:'🗺 Turnierbaum'},{id:'elo',l:'⚙️ Elo'},{id:'api',l:'🌐 Live-Update'},{id:'export',l:'📋 Export'}];
  t.innerHTML=items.map(x=>`<button class="tab ${activeTab===x.id?'active':''}" data-tab="${x.id}">${x.l}</button>`).join('');
}

function renderGroup(gi){
  const tids=GROUPS[gi];
  let h='';
  h+=`<button class="params-toggle" id="ptoggle">⚙ Modell-Parameter ${paramsOpen?'▲':'▼'}</button>`;
  h+=`<div class="params-panel ${paramsOpen?'open':''}">${renderParams()}</div>`;
  h+=`<div class="group-header"><h2>Gruppe ${GN[gi]}</h2></div>`;

  // Count locked/total
  let locked=0;
  for(let i=0;i<6;i++){const r=results[`g${gi}_m${i}`];if(r&&r.locked)locked++}
  h+=`<div class="info-box">`;
  h+=`<strong>${locked}/6 Spiele gespielt.</strong> `;
  if(locked<6)h+=`Offene Spiele zeigen Elo-Poisson-Prognosen. Trage das Ergebnis ein und klicke 🔒 um es zu sperren — alle Folgeprognosen passen sich automatisch an.`;
  else h+=`Alle Gruppenspiele sind eingetragen und gesperrt.`;
  h+=`</div>`;

  for(let md=0;md<3;md++){
    h+=`<div class="matchday"><div class="matchday-title"><span>Spieltag ${md+1}</span><span class="md-date">${MD_DATES[gi][md]}</span></div>`;
    for(let mi=0;mi<2;mi++){
      const[hi,ai]=MDS[md][mi];
      const hid=tids[hi],aid=tids[ai];
      const key=`g${gi}_m${md*2+mi}`;
      const r=results[key]||{goalsA:'',goalsB:'',locked:false};
      const pred=predictMatch(hid,aid);
      const isLocked=r.locked;

      h+=`<div class="match-card ${isLocked?'is-locked':'is-prediction'}">`;

      // Status badge
      if(isLocked){
        h+=`<div class="match-status played">✅ Gespielt</div>`;
      }else{
        h+=`<div class="match-status prediction">🔮 Prognose</div>`;
      }

      // Teams + Score
      h+=`<div class="match-teams">`;
      h+=`<div class="match-team home"><span class="flag">${TEAMS[hid].flag}</span><span>${TEAMS[hid].name}</span></div>`;

      if(isLocked){
        h+=`<div class="match-score-display is-played">${r.goalsA}<span class="sep">:</span>${r.goalsB}</div>`;
      }else{
        h+=`<div class="match-score-display is-pred">${pred.goalsA}<span class="sep">:</span>${pred.goalsB}</div>`;
      }

      h+=`<div class="match-team away"><span>${TEAMS[aid].name}</span><span class="flag">${TEAMS[aid].flag}</span></div>`;
      h+=`</div>`;

      // Meta (probabilities)
      h+=`<div class="match-meta">`;
      h+=`<span class="prob">⚽ λ ${pred.lA.toFixed(2)} – ${pred.lB.toFixed(2)}</span>`;
      h+=`<span class="prob">Sieg ${(pred.pW*100).toFixed(0)}%</span>`;
      h+=`<span class="prob">Remis ${(pred.pD*100).toFixed(0)}%</span>`;
      h+=`<span class="prob">Ndlg. ${(pred.pL*100).toFixed(0)}%</span>`;
      h+=`</div>`;

      if(isLocked){
        // Show what prediction was
        h+=`<div class="pred-was">Prognose war: ${pred.goalsA}:${pred.goalsB}</div>`;
        h+=`<div style="text-align:center;margin-top:8px">`;
        h+=`<button class="btn-lock unlock" data-key="${key}">🔓 Entsperren</button></div>`;
      }else{
        // Input row
        h+=`<div class="match-input-row">`;
        h+=`<label>Ergebnis:</label>`;
        const vA=r.goalsA!==''?r.goalsA:'';
        const vB=r.goalsB!==''?r.goalsB:'';
        h+=`<input type="number" min="0" max="20" value="${vA}" data-key="${key}" data-side="A" class="${vA!==''?'filled':''}" placeholder="–">`;
        h+=`<span class="sep">:</span>`;
        h+=`<input type="number" min="0" max="20" value="${vB}" data-key="${key}" data-side="B" class="${vB!==''?'filled':''}" placeholder="–">`;
        const canLock=vA!==''&&vB!=='';
        h+=`<button class="btn-lock lock" data-key="${key}" ${canLock?'':'disabled'}>🔒 Sperren</button>`;
        h+=`</div>`;
      }

      h+=`</div>`;
    }
    h+=`</div>`;
  }

  // Actions
  h+=`<div class="actions">`;
  h+=`<button class="btn btn-gold" id="fillAll" data-gi="${gi}">Alle Prognosen als Tipp übernehmen</button>`;
  h+=`<button class="btn btn-outline" id="lockAll" data-gi="${gi}">Alle eingetragenen sperren</button>`;
  h+=`<button class="btn btn-outline" style="border-color:var(--red);color:var(--red)" id="clearGrp" data-gi="${gi}">Alles zurücksetzen</button>`;
  h+=`</div>`;

  // Table
  const tb=calcTable(gi);
  h+=`<h3 style="color:var(--gold);margin-top:20px;margin-bottom:4px">Tabelle Gruppe ${GN[gi]}</h3>`;
  h+=`<p style="font-size:.72em;color:var(--txt3);margin-bottom:8px">${locked<6?'Kombination aus gesperrten Resultaten und Prognosen':'Basierend auf allen eingetragenen Resultaten'}</p>`;
  h+=renderTable(tb);
  return h;
}

function renderTable(tb){

    const cls=i===0?'q1':i===1?'q2':i===2?'q3':'';
    const diff=TEAMS[t.id].elo-TEAMS[t.id].base;
    const diffStr=diff>0?`<span style="color:var(--green)">+${diff}</span>`:diff<0?`<span style="color:var(--red)">${diff}</span>`:'';
    h+=`<tr class="${cls}"><td class="num"><span class="pos">${i+1}</span></td>`;
    h+=`<td><div class="team-cell"><span class="flag">${TEAMS[t.id].flag}</span>${TEAMS[t.id].name} <span style="color:var(--txt3);font-size:.75em">${TEAMS[t.id].elo} ${diffStr}</span></div></td>`;
    h+=`<td class="num">${t.played}/3</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td>`;
    h+=`<td class="num">${t.gf}:${t.ga}</td><td class="num">${t.gd>0?'+':''}${t.gd}</td>`;
    h+=`<td class="num" style="font-weight:700;font-size:1.05em">${t.pts}</td></tr>`;

  h+=`<div class="legend"><span class="l1">Gruppensieger</span><span class="l2">Gruppenzweiter</span><span class="l3">Pot. bester Dritter</span></div>`;

function renderKOCard(m){
  const tAid=resolveSlot(m.slotA);
  const tBid=resolveSlot(m.slotB);
  const tA=tAid!==null?TEAMS[tAid]:null;
  const tB=tBid!==null?TEAMS[tBid]:null;
  const kr=koResults[m.id]||{goalsA:'',goalsB:'',locked:false,pens:null};
  const isLocked=kr.locked;
  const isPending=!tA||!tB;
  const cardCls=isLocked?'is-locked':isPending?'is-pending':'is-prediction';

  let h=`<div class="ko-card ${cardCls}">`;

  // Use pre-computed prediction or real result
  const pred = koPredictions[m.id] || null;
  // For display: use prediction teams if resolveSlot returns null
  const dispAid = tAid !== null ? tAid : (pred ? pred.teamA : null);
  const dispBid = tBid !== null ? tBid : (pred ? pred.teamB : null);
  const dispA = dispAid !== null ? TEAMS[dispAid] : null;
  const dispB = dispBid !== null ? TEAMS[dispBid] : null;
  const hasPred = pred !== null;
  const isKnown = dispA && dispB;

  // Status badge
  if(isLocked)      h+=`<div class="ko-status real">✅ Gespielt · ${m.label} · ${m.date}</div>`;
  else if(isKnown)  h+=`<div class="ko-status pred">🔮 Prognose · ${m.label} · ${m.date}</div>`;
  else              h+=`<div class="ko-status pred">⏳ ${m.label} · ${m.date}</div>`;

  // Teams + score
  h+=`<div class="ko-card-teams">`;
  if(dispA) h+=`<div class="ko-card-team">${dispA.flag} ${dispA.name}</div>`;
  else h+=`<div class="ko-card-team tbd">${slotLabel(m.slotA)}</div>`;

  // Center score
  h+=`<div class="ko-score-center">`;
  if(isLocked){
    h+=`<div class="ko-score-disp real">${kr.goalsA}<span style="color:var(--txt3);font-weight:400">:</span>${kr.goalsB}</div>`;
    if(kr.pens) h+=`<div class="ko-winner-badge">🎯 n.E. ${kr.pens==='A'?dispA?.name:dispB?.name} weiter</div>`;
  } else if(hasPred){
    h+=`<div class="ko-score-disp pred">${pred.goalsA}:${pred.goalsB}</div>`;
    h+=`<div class="ko-probs">${(pred.pW*100).toFixed(0)}% · ${(pred.pD*100).toFixed(0)}% · ${(pred.pL*100).toFixed(0)}%</div>`;
  } else {
    h+=`<div class="ko-score-disp pred" style="font-size:.9em">?:?</div>`;
  }
  h+=`</div>`;

  if(dispB) h+=`<div class="ko-card-team away">${dispB.name} ${dispB.flag}</div>`;
  else h+=`<div class="ko-card-team away tbd">${slotLabel(m.slotB)}</div>`;
  h+=`</div>`;

  // Input row (only if teams known and not locked)
  if(!isLocked&&isKnown){
    // Pre-fill input with prediction if user hasn't typed anything yet
    const vA=kr.goalsA!==''?kr.goalsA:(hasPred?pred.goalsA:'');
    const vB=kr.goalsB!==''?kr.goalsB:(hasPred?pred.goalsB:'');
    const canLock=vA!==''&&vB!=='';
    const isDraw=canLock&&parseInt(vA)===parseInt(vB);
    h+=`<div class="ko-input-row">`;
    h+=`<input type="number" min="0" max="20" value="${vA}" data-ko="${m.id}" data-side="A" class="${vA!==''?'filled':''}" placeholder="–">`;
    h+=`<span class="sep">:</span>`;
    h+=`<input type="number" min="0" max="20" value="${vB}" data-ko="${m.id}" data-side="B" class="${vB!==''?'filled':''}" placeholder="–">`;
    h+=`<button class="btn-lock lock" data-ko="${m.id}" ${canLock?'':'disabled'}>🔒 Sperren</button>`;
    h+=`</div>`;
    // Penalty selector (only if draw)
    if(isDraw){
      const pens=kr.pens||'';
      h+=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:.8em">`;
      h+=`<span style="color:var(--txt2)">n.E. weiter:</span>`;
      h+=`<button class="btn-pens ${pens==='A'?'active':''}" data-ko="${m.id}" data-pens="A" style="padding:3px 10px;border-radius:4px;border:1px solid ${pens==='A'?'var(--green)':'var(--border)'};background:${pens==='A'?'rgba(39,174,96,.2)':'transparent'};color:${pens==='A'?'var(--green)':'var(--txt2)'}">`;
      h+=`${dispA.flag} ${dispA.name}</button>`;
      h+=`<button class="btn-pens ${pens==='B'?'active':''}" data-ko="${m.id}" data-pens="B" style="padding:3px 10px;border-radius:4px;border:1px solid ${pens==='B'?'var(--green)':'var(--border)'};background:${pens==='B'?'rgba(39,174,96,.2)':'transparent'};color:${pens==='B'?'var(--green)':'var(--txt2)'}">`;
      h+=`${dispB.flag} ${dispB.name}</button>`;
      h+=`</div>`;
    }
  }

  // Unlock button if locked
  if(isLocked){
    h+=`<div style="text-align:center;margin-top:8px">`;
    h+=`<button class="btn-lock unlock" data-ko="${m.id}">🔓 Entsperren</button></div>`;
  }

  h+=`</div>`;
  return h;
}

function genExport(){
  let L=['WM 2026 TIPPSPIEL — Stand: '+new Date().toLocaleString('de-CH'),''];
  for(let gi=0;gi<12;gi++){
    L.push(`── Gruppe ${GN[gi]} ──`);
    const tids=GROUPS[gi];
    for(let md=0;md<3;md++){
      for(let mi=0;mi<2;mi++){
        const[hi,ai]=MDS[md][mi];
        const hid=tids[hi],aid=tids[ai];
        const key=`g${gi}_m${md*2+mi}`;
        const r=results[key];
        const pr=predictMatch(hid,aid);
        let ln=`  ${TEAMS[hid].name} – ${TEAMS[aid].name}: `;
        if(r&&r.locked)ln+=`${r.goalsA}:${r.goalsB} ✅ (Prognose: ${pr.goalsA}:${pr.goalsB})`;
        else ln+=`${pr.goalsA}:${pr.goalsB} 🔮`;
        L.push(ln);
      }
    }
    const tb=calcTable(gi);
    L.push(`  → ${tb.map((t,i)=>`${i+1}.${TEAMS[t.id].name}(${t.pts}P)`).join(' | ')}`);
    L.push('');
  }
  return L.join('\n');
}

// Match key lookup: [teamIdA, teamIdB] → "g{gi}_m{mi}"
function buildMatchKeyMap(){
  const map={};
  for(let gi=0;gi<12;gi++){
    const tids=GROUPS[gi];
    for(let md=0;md<3;md++){
      for(let mi=0;mi<2;mi++){
        const[hi,ai]=MDS[md][mi];
        const key=`g${gi}_m${md*2+mi}`;
        const pair=[tids[hi],tids[ai]].sort((a,b)=>a-b).join('_');
        map[pair]=key;
      }
    }
  }
  return map;
}

async function apiTest(token){
  const r=await fetch('https://api.football-data.org/v4/competitions/WC/matches?season=2026&limit=1',{
    headers:{'X-Auth-Token':token}
  });
  if(!r.ok) throw new Error(`HTTP ${r.status}`);

}

async function apiFetchAllMatches(token){
  const r=await fetch('https://api.football-data.org/v4/competitions/WC/matches?season=2026',{
    headers:{'X-Auth-Token':token}
  });
  if(!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
  return await r.json();
}

let updateLog=[];

async function apiUpdateResults(){
  if(apiUpdating)return;
  apiUpdating=true;
  updateLog=[];
  apiStatus='loading';
  apiStatusMsg='Lade Spiele von football-data.org...';
  render();

  try{
    const data=await apiFetchAllMatches(apiToken);
    const matches=data.matches||[];
    const mkMap=buildMatchKeyMap();
    let newCount=0, skipCount=0, warnCount=0;

    const groupMatches=matches.filter(m=>m.stage==='GROUP_STAGE'||m.group);

    for(const m of groupMatches){
      const status=m.status; // FINISHED, IN_PLAY, TIMED, SCHEDULED
      if(status!=='FINISHED') continue;

      const hName=m.homeTeam?.name||'';
      const aName=m.awayTeam?.name||'';
      const hId=FD_NAME_MAP[hName];
      const aId=FD_NAME_MAP[aName];

      if(hId===undefined||aId===undefined){
        updateLog.push({type:'warn',msg:`Unbekannte Teams: "${hName}" vs "${aName}"`});
        warnCount++;
        continue;
      }

      const pair=[hId,aId].sort((a,b)=>a-b).join('_');
      const matchKey=mkMap[pair];
      if(!matchKey){
        updateLog.push({type:'warn',msg:`Kein Match-Key für ${TEAMS[hId].name} vs ${TEAMS[aId].name}`});
        warnCount++;
        continue;
      }

      const gA=m.score?.fullTime?.home??null;
      const gB=m.score?.fullTime?.away??null;
      if(gA===null||gB===null) continue;

      // Check if home/away order matches our internal order
      const parts=matchKey.split('_');
      const gi=parseInt(parts[0].slice(1));
      const mi=parseInt(parts[1].slice(1));
      const md=Math.floor(mi/2);
      const mmi=mi%2;
      const [internalHi,internalAi]=MDS[md][mmi];
      const internalH=GROUPS[gi][internalHi];
      const internalA=GROUPS[gi][internalAi];

      // Swap goals if API home/away doesn't match internal order
      let finalA,finalB;
      if(internalH===hId){finalA=gA;finalB=gB;}
      else{finalA=gB;finalB=gA;}

      const existing=results[matchKey];
      if(existing&&existing.locked&&existing.goalsA===finalA&&existing.goalsB===finalB){
        skipCount++;
        updateLog.push({type:'skip',msg:`${TEAMS[internalH].name} ${finalA}:${finalB} ${TEAMS[internalA].name} (bereits gesperrt)`});
      } else {
        const isNew=!existing||!existing.locked;
        results[matchKey]={goalsA:finalA,goalsB:finalB,locked:true};
        newCount++;
        updateLog.push({type:'new',msg:`${TEAMS[internalH].flag} ${TEAMS[internalH].name} ${finalA}:${finalB} ${TEAMS[internalA].name} ${TEAMS[internalA].flag}${isNew?'  ✅ NEU':'  🔄 Aktualisiert'}`});
      }
    }

    recalcAllElos();
    apiLastUpdate=new Date().toLocaleString('de-CH');
    apiStatus='ok';
    const played=groupMatches.filter(m=>m.status==='FINISHED').length;
    apiStatusMsg=`✅ ${played}/72 Gruppenspiele gespielt · ${newCount} neu/aktualisiert · ${skipCount} unverändert${warnCount>0?` · ⚠ ${warnCount} Warnungen`:''}`;

    if(newCount>0){
      updateLog.unshift({type:'new',msg:`🎉 ${newCount} Ergebnis(se) neu eingetragen und gesperrt!`});
    }else{
      updateLog.unshift({type:'skip',msg:`ℹ Alle bekannten Ergebnisse waren bereits aktuell.`});
    }

  }catch(e){
    apiStatus='error';
    apiStatusMsg=`❌ Fehler: ${e.message}`;
    updateLog=[{type:'err',msg:e.message}];
  }

  apiUpdating=false;
  render();
}

  h+=`<button class="btn btn-gold" id="btnUpdate" ${!hasToken||apiUpdating?'disabled':''}>`;
  h+=apiUpdating?'⏳ Wird geladen...':'🔄 Resultate jetzt aktualisieren';
  h+=`</button>`;
  if(apiLastUpdate&&!apiUpdating) h+=`<span style="font-size:.75em;color:var(--txt3)">Letztes Update: ${apiLastUpdate}</span>`;
  h+=`</div>`;

  if(apiStatus){
    h+=`<div class="status-badge ${badgeCls}" style="margin-bottom:12px">${badgeTxt}</div>`;
  }

  if(apiUpdating){
    h+=`<div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>`;
  }

  // Update log
  if(updateLog.length>0){
    h+=`<div class="update-log">`;
    updateLog.forEach(e=>{
      const icons={new:'✅',skip:'–',warn:'⚠️',err:'❌'};
      h+=`<div class="log-entry ${e.type}"><span class="log-icon">${icons[e.type]||'•'}</span><span>${e.msg}</span></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  // Info box
  h+=`<div class="api-section"><h3>ℹ Hinweise</h3>`;
  h+=`<div class="info-box" style="color:var(--txt2)">`;
  h+=`<p>• Nur abgeschlossene Gruppenspiele (Status FINISHED) werden eingetragen.</p>`;
  h+=`<p style="margin-top:6px">• Bereits manuell gesperrte Spiele werden nur überschrieben wenn das API-Ergebnis abweicht.</p>`;
  h+=`<p style="margin-top:6px">• Nach dem Update werden alle Elo-Werte neu berechnet und alle offenen Prognosen aktualisiert.</p>`;
  h+=`<p style="margin-top:6px">• Rate Limit: 10 Calls/Minute — bei normalem Gebrauch (1× täglich) kein Problem.</p>`;
  h+=`</div></div>`;

  return h;
}

function renderBracketPage(){
  let h=`<h2 style="color:var(--gold);margin-bottom:4px">🗺 Turnierbaum</h2>`;
  h+=`<p style="color:var(--txt2);font-size:.82em;margin-bottom:8px">Automatisch aktualisiert. Klick auf einen Match-Block wechselt zur K.o.-Phase zum Tippen.</p>`;
  h+=`<div class="bracket-legend">`;
  h+=`<span class="bl-pred">🔮 Prognose</span>`;
  h+=`<span class="bl-real">✅ Gespielt</span>`;
  h+=`<span class="bl-tbd">⏳ Ausstehend</span>`;
  h+=`</div>`;
  h+=`<div id="bracketWrap"><canvas id="bracketCanvas"></canvas></div>`;
  return h;
}

function renderBracket(){
  const canvas=document.getElementById('bracketCanvas');
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;

  // Layout constants
  const MW=130, MH=46, MG=8;  // match width, height, gap between matches
  const RG=48;                  // gap between rounds
  const ROUNDS=['r32','r16','qf','sf','final'];
  const roundCounts={r32:16,r16:8,qf:4,sf:2,final:1};
  const PAD={top:40,left:12,right:12,bottom:20};

  // Total height needed: r32 has 16 matches
  const totalH=16*(MH+MG)-MG;
  const totalW=5*MW+4*RG;
  const W=totalW+PAD.left+PAD.right;
  const H=totalH+PAD.top+PAD.bottom;

  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Background
  ctx.fillStyle='#0b1222';
  ctx.fillRect(0,0,W,H);

  // Round labels
  const rLabels={r32:'Sechzehntelfinale',r16:'Achtelfinale',qf:'Viertelfinale',sf:'Halbfinale',final:'Finale'};
  ctx.font='bold 9px "Segoe UI",sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle='#d4a843';

  // Position of each round's left edge
  function roundX(ri){ return PAD.left + ri*(MW+RG); }

  // Position of match[i] in round with count N
  // Left half: r32 matches 0-7 (top), right half would be mirrored
  // We do single-elimination left→right bracket
  function matchY(ri, mi){
    // In round ri, there are N=16/2^ri matches
    const N=16/Math.pow(2,ri);
    // Each match occupies a "slot" of height totalH/N
    const slotH=totalH/N;
    return PAD.top + mi*slotH + (slotH-MH)/2;
  }

  // Draw round headers
  ROUNDS.forEach((rnd,ri)=>{
    ctx.fillStyle='#d4a843';
    ctx.font='bold 9px "Segoe UI",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(rLabels[rnd], roundX(ri)+MW/2, PAD.top-8);
  });

  // Draw connector lines between rounds
  ctx.strokeStyle='#1e2d4a';
  ctx.lineWidth=1.5;
  ROUNDS.forEach((rnd,ri)=>{
    if(ri===0) return;
    const N=16/Math.pow(2,ri);
    const prevN=N*2;
    for(let mi=0;mi<N;mi++){
      const y1=matchY(ri-1, mi*2)+MH/2;
      const y2=matchY(ri-1, mi*2+1)+MH/2;
      const yMid=(y1+y2)/2;
      const xPrev=roundX(ri-1)+MW;
      const xCurr=roundX(ri);
      // Horizontal lines from prev matches
      ctx.beginPath();ctx.moveTo(xPrev,y1);ctx.lineTo(xPrev+RG/2,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(xPrev,y2);ctx.lineTo(xPrev+RG/2,y2);ctx.stroke();
      // Vertical connector
      ctx.beginPath();ctx.moveTo(xPrev+RG/2,y1);ctx.lineTo(xPrev+RG/2,y2);ctx.stroke();
      // Horizontal to current match
      ctx.beginPath();ctx.moveTo(xPrev+RG/2,yMid);ctx.lineTo(xCurr,yMid);ctx.stroke();
    }
  });

  // Build ordered match list per round (left-side bracket order)
  // r32: matches 0-15 in order
  // r16: winners of r32_1+r32_2 → r16_1, etc.
  const matchOrder={
    r32:['r32_1','r32_2','r32_3','r32_4','r32_5','r32_6','r32_7','r32_8',
         'r32_9','r32_10','r32_11','r32_12','r32_13','r32_14','r32_15','r32_16'],
    r16:['r16_1','r16_2','r16_3','r16_4','r16_5','r16_6','r16_7','r16_8'],
    qf: ['qf_1','qf_2','qf_3','qf_4'],
    sf: ['sf_1','sf_2'],
    final:['final_1'],
  };

  // Draw matches — uses koPredictions + koResults (already computed in render())
  const clickZones=[];

  function truncate(ctx, txt, maxW){
    while(ctx.measureText(txt).width>maxW&&txt.length>3) txt=txt.slice(0,-1);
    return txt.length<txt.length?txt.slice(0,-1)+'…':txt;
  }

  ROUNDS.forEach((rnd,ri)=>{
    const ids=matchOrder[rnd];
    ids.forEach((mid,mi)=>{
      const m=KO_BRACKET.find(x=>x.id===mid);
      if(!m) return;
      const x=roundX(ri), y=matchY(ri,mi);

      // Get data: real result takes priority, else use koPredictions
      const kr=koResults[mid];
      const isLocked=kr&&kr.locked;
      const pred=koPredictions[mid]; // always set by computeKOPredictions if resolvable

      // Resolve team ids: from real result or prediction
      let tAid=null, tBid=null;
      if(isLocked){
        // Resolve from actual locked result chain
        tAid=resolveSlot(m.slotA);
        tBid=resolveSlot(m.slotB);
      }
      if(tAid===null && pred) tAid=pred.teamA;
      if(tBid===null && pred) tBid=pred.teamB;
      const tA=tAid!==null?TEAMS[tAid]:null;
      const tB=tBid!==null?TEAMS[tBid]:null;
      const hasPred=!!pred;
      const hasData=tA&&tB&&(isLocked||hasPred);

      // Score string
      let scoreStr='', scoreColor='#5d6a85';
      if(isLocked){
        scoreStr=`${kr.goalsA}:${kr.goalsB}${kr.pens?' n.E.':''}`;
        scoreColor='#27ae60';
      } else if(hasPred){
        scoreStr=`${pred.goalsA}:${pred.goalsB}`;
        scoreColor='#5d6a85';
      }

      // Winner highlight
      let winnerA=false, winnerB=false;
      if(isLocked){
        const gA=parseInt(kr.goalsA), gB=parseInt(kr.goalsB);
        if(gA>gB||(gA===gB&&kr.pens==='A')) winnerA=true; else winnerB=true;
      } else if(hasPred){
        // Highlight predicted winner dimly
        if(pred.goalsA>pred.goalsB) winnerA=true; else winnerB=true;
      }

      // Card style
      const bgColor=isLocked?'#0d2218':'#131d33';
      const borderColor=isLocked?'#27ae60':hasPred?'#3d5275':'#1e2d4a';
      const accentColor=isLocked?'#27ae60':hasPred?'#3d5275':'#1a2744';

      ctx.fillStyle=bgColor; ctx.strokeStyle=borderColor; ctx.lineWidth=isLocked?2:1;
      roundRect(ctx,x,y,MW,MH,4); ctx.fill(); ctx.stroke();
      ctx.fillStyle=accentColor;
      roundRect(ctx,x,y,3,MH,{tl:4,bl:4,tr:0,br:0}); ctx.fill();

      // Layout
      ctx.textAlign='left';
      const nameX=x+8, scoreX=x+MW-6;
      const yA=y+15, yB=y+31, yScr=y+MH/2+1;
      const maxNameW=MW-52;

      // Team A row
      if(tA){
        ctx.font=`${isLocked&&winnerA?'bold ':''}9px "Segoe UI",sans-serif`;
        ctx.fillStyle=isLocked?(winnerA?'#e8eaf0':'#5d6a85'):(winnerA?'#c8cad4':'#9aa3b8');
        let txt=tA.flag+' '+tA.name;
        while(ctx.measureText(txt).width>maxNameW&&txt.length>4) txt=txt.slice(0,-1);
        ctx.fillText(txt, nameX, yA);
      } else {
        ctx.font='italic 8px "Segoe UI",sans-serif'; ctx.fillStyle='#3d5275';
        ctx.fillText(slotLabel(m.slotA), nameX, yA);
      }

      // Divider
      ctx.strokeStyle='#1e2d4a'; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x+4,y+MH/2); ctx.lineTo(x+MW-4,y+MH/2); ctx.stroke();

      // Team B row
      if(tB){
        ctx.font=`${isLocked&&winnerB?'bold ':''}9px "Segoe UI",sans-serif`;
        ctx.fillStyle=isLocked?(winnerB?'#e8eaf0':'#5d6a85'):(winnerB?'#c8cad4':'#9aa3b8');
        let txt=tB.flag+' '+tB.name;
        while(ctx.measureText(txt).width>maxNameW&&txt.length>4) txt=txt.slice(0,-1);
        ctx.fillText(txt, nameX, yB);
      } else {
        ctx.font='italic 8px "Segoe UI",sans-serif'; ctx.fillStyle='#3d5275';
        ctx.fillText(slotLabel(m.slotB), nameX, yB);
      }

      // Score
      if(scoreStr){
        ctx.textAlign='right';
        ctx.font=`bold ${isLocked?'11':'10'}px "Segoe UI",sans-serif`;
        ctx.fillStyle=scoreColor;
        ctx.fillText(scoreStr, scoreX, yScr);
      }

      clickZones.push({x,y,w:MW,h:MH});
    });
  });

  // Finale trophy
  const fx=roundX(4)+MW/2;
  ctx.textAlign='center';
  ctx.font='20px serif';
  ctx.fillText('🏆', fx, PAD.top-24);

  // Click handler
  canvas.onclick=(e)=>{
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left);
    const my=(e.clientY-rect.top);
    for(const z of clickZones){
      if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){
        activeTab='knockout'; render(); break;
      }
    }
  };
}

function roundRect(ctx,x,y,w,h,r){
  if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
  ctx.beginPath();
  ctx.moveTo(x+r.tl,y);
  ctx.lineTo(x+w-r.tr,y);ctx.arcTo(x+w,y,x+w,y+r.tr,r.tr);
  ctx.lineTo(x+w,y+h-r.br);ctx.arcTo(x+w,y+h,x+w-r.br,y+h,r.br);
  ctx.lineTo(x+r.bl,y+h);ctx.arcTo(x,y+h,x,y+h-r.bl,r.bl);
  ctx.lineTo(x,y+r.tl);ctx.arcTo(x,y,x+r.tl,y,r.tl);
  ctx.closePath();
}

// ============================================================
// EVENTS
// ============================================================
function bind(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeTab=t.dataset.tab;render()});
  document.querySelectorAll('[data-goto]').forEach(c=>c.onclick=()=>{activeTab=c.dataset.goto;render()});

  document.querySelectorAll('.match-input-row input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const k=inp.dataset.key,s=inp.dataset.side;
      if(!results[k])results[k]={goalsA:'',goalsB:'',locked:false};
      const v=inp.value===''?'':parseInt(inp.value);
      if(s==='A')results[k].goalsA=isNaN(v)?'':v;
      else results[k].goalsB=isNaN(v)?'':v;
      // Enable/disable lock button
      const card=inp.closest('.match-card');
      const lockBtn=card.querySelector('.btn-lock.lock');
      if(lockBtn){
        const r=results[k];
        lockBtn.disabled=!(r.goalsA!==''&&r.goalsB!=='');
      }
      save();
    });
  });

  // Lock buttons
  document.querySelectorAll('.btn-lock.lock').forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.key;
      if(results[k]&&results[k].goalsA!==''&&results[k].goalsB!==''){
        results[k].locked=true;
        render();
      }
    };
  });

  // Unlock buttons
  document.querySelectorAll('.btn-lock.unlock').forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.key;
      if(results[k]){results[k].locked=false;render()}
    };
  });

  // Params
  document.querySelectorAll('[data-param]').forEach(inp=>{
    inp.addEventListener('change',()=>{P[inp.dataset.param]=parseFloat(inp.value);render()});
  });

  // Elo
  document.querySelectorAll('[data-elo]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const id=parseInt(inp.dataset.elo);
      TEAMS[id].elo=parseInt(inp.value);TEAMS[id].base=parseInt(inp.value);render();
    });
  });

  const pt=document.getElementById('ptoggle');
  if(pt)pt.onclick=()=>{paramsOpen=!paramsOpen;render()};

  // Fill all predictions
  const fa=document.getElementById('fillAll');
  if(fa)fa.onclick=()=>{
    const gi=parseInt(fa.dataset.gi),tids=GROUPS[gi];
    for(let md=0;md<3;md++)for(let mi=0;mi<2;mi++){
      const k=`g${gi}_m${md*2+mi}`;
      if(!results[k]||!results[k].locked){
        const[hi,ai]=MDS[md][mi];
        const pr=predictMatch(tids[hi],tids[ai]);
        results[k]={goalsA:pr.goalsA,goalsB:pr.goalsB,locked:false};
      }
    }
    render();
  };

  // Lock all entered
  const la=document.getElementById('lockAll');
  if(la)la.onclick=()=>{
    const gi=parseInt(la.dataset.gi);
    for(let i=0;i<6;i++){
      const k=`g${gi}_m${i}`,r=results[k];
      if(r&&r.goalsA!==''&&r.goalsB!==''&&!r.locked)r.locked=true;
    }
    render();
  };

  // Clear group
  const cg=document.getElementById('clearGrp');
  if(cg)cg.onclick=()=>{
    const gi=parseInt(cg.dataset.gi);
    for(let i=0;i<6;i++)delete results[`g${gi}_m${i}`];
    recalcAllElos();render();
  };

  // Reset elo
  const re=document.getElementById('resetElo');
  if(re)re.onclick=()=>{TEAMS.forEach(t=>{t.elo=t.base});results={};render()};

  // Export
  const ex=document.getElementById('doExport');
  if(ex)ex.onclick=()=>{document.getElementById('exportBox').textContent=genExport()};

  // API Tab bindings
  const ti=document.getElementById('tokenInput');
  const bst=document.getElementById('btnSaveToken');
  const btt=document.getElementById('btnTestToken');
  const bup=document.getElementById('btnUpdate');

  if(ti) ti.addEventListener('input',()=>{
    // enable/disable test button live
    const hasT=ti.value.trim().length>10;
    if(btt) btt.disabled=!hasT;
  });

  if(bst) bst.onclick=()=>{
    const val=document.getElementById('tokenInput')?.value?.trim()||'';
    if(val.length<5){alert('Bitte gültigen Token eingeben.');return;}
    apiToken=val;
    apiStatus=null;
    apiStatusMsg='';
    render();
  };

  if(btt) btt.onclick=async()=>{
    const val=document.getElementById('tokenInput')?.value?.trim()||apiToken;
    if(!val){return;}
    apiToken=val;
    apiStatus='loading';
    apiStatusMsg='Verbindung wird geprüft...';
    render();
    try{
      const d=await apiTest(apiToken);
      const total=(d.resultSet?.count||d.matches?.length||'?');
      apiStatus='ok';
      apiStatusMsg=`✅ Token gültig! API antwortet · ${total} WM-Spiele gefunden`;
    }catch(e){
      apiStatus='error';
      apiStatusMsg=`❌ Token ungültig oder kein Zugriff: ${e.message}`;
    }
    render();
  };

  if(bup) bup.onclick=()=>apiUpdateResults();

  // Fill all KO predictions
  const fko=document.getElementById('fillKO');
  if(fko) fko.onclick=()=>{
    // Build a working copy that starts with all real locked results
    // This is used as the override for resolveSlot so we can chain rounds
    const tempKR={};
    // Seed with existing locked (manual) results
    Object.keys(koResults).forEach(k=>{
      if(koResults[k]&&koResults[k].locked) tempKR[k]={...koResults[k]};
    });

    const rounds=[
      ['r32_1','r32_2','r32_3','r32_4','r32_5','r32_6','r32_7','r32_8',
       'r32_9','r32_10','r32_11','r32_12','r32_13','r32_14','r32_15','r32_16'],
      ['r16_1','r16_2','r16_3','r16_4','r16_5','r16_6','r16_7','r16_8'],
      ['qf_1','qf_2','qf_3','qf_4'],
      ['sf_1','sf_2'],
      ['3p_1','final_1'],
    ];

    // resolveForFill: like resolveSlot but uses tempKR and doesn't need locked flag
    // directly reads score from tempKR to find winner
    function resolveForFill(slot){
      if(slot.src==='grp'){
        const gi=GN.indexOf(slot.g);
        const tb=calcTable(gi);
        return tb[slot.pos-1]?.id ?? null;
      }
      // src='ko': look in tempKR
      const kr=tempKR[slot.id];
      if(!kr) return null; // not yet computed this fill session
      const m=KO_BRACKET.find(x=>x.id===slot.id);
      if(!m) return null;
      const tA=resolveForFill(m.slotA), tB=resolveForFill(m.slotB);
      if(tA===null||tB===null) return null;
      const gA=kr.goalsA, gB=kr.goalsB;
      if(slot.w){
        if(gA>gB) return tA;
        if(gB>gA) return tB;
        if(kr.pens==='A') return tA;
        if(kr.pens==='B') return tB;
        return tA; // fallback: slot A wins
      } else {
        if(gA>gB) return tB;
        if(gB>gA) return tA;
        return tB; // fallback
      }
    }

    for(const roundMatches of rounds){
      for(const mid of roundMatches){
        // Skip manually locked real results
        if(koResults[mid]&&koResults[mid].locked) continue;
        const m=KO_BRACKET.find(x=>x.id===mid);
        if(!m) continue;
        const tAid=resolveForFill(m.slotA);
        const tBid=resolveForFill(m.slotB);
        if(tAid===null||tBid===null) continue;
        const pr=predictMatch(tAid,tBid);
        let gA=pr.goalsA, gB=pr.goalsB;
        if(gA===gB){ if(pr.pW>=pr.pL) gA++; else gB++; }
        tempKR[mid]={goalsA:gA,goalsB:gB,pens:null,autoFilled:true};
      }
    }

    // Write auto-filled results into koResults as UNLOCKED predictions
    // (real locked results keep their locked:true)
    Object.keys(tempKR).forEach(mid=>{
      if(tempKR[mid].autoFilled){
        koResults[mid]={
          goalsA:tempKR[mid].goalsA,
          goalsB:tempKR[mid].goalsB,
          locked:false,
          pens:null
        };
      }
    });

    saveKO(); render();
  };

  const cko=document.getElementById('clearKO');
  if(cko) cko.onclick=()=>{
    if(confirm('Alle KO-Tipps löschen?')){ koResults={}; saveKO(); render(); }
  };

  // ── KO score inputs ──────────────────────────────────────────
  document.querySelectorAll('input[data-ko][data-side]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const id=inp.dataset.ko, side=inp.dataset.side;
      if(!koResults[id]) koResults[id]={goalsA:'',goalsB:'',locked:false,pens:null};
      const v=inp.value===''?'':parseInt(inp.value);
      if(side==='A') koResults[id].goalsA=isNaN(v)?'':v;
      else           koResults[id].goalsB=isNaN(v)?'':v;
      saveKO(); render();
    });
  });

  // ── KO lock buttons ──────────────────────────────────────────
  document.querySelectorAll('.btn-lock.lock[data-ko]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.ko;
      const kr=koResults[id];
      if(!kr||kr.goalsA===''||kr.goalsB==='') return;
      const gA=parseInt(kr.goalsA), gB=parseInt(kr.goalsB);
      if(gA===gB && !kr.pens){
        alert('Unentschieden nach Verlängerung: Bitte zuerst den Elfmeter-Sieger wählen!');
        return;
      }
      koResults[id].locked=true;
      saveKO(); render();
    };
  });

  // ── KO unlock buttons ────────────────────────────────────────
  document.querySelectorAll('.btn-lock.unlock[data-ko]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.ko;
      if(koResults[id]){ koResults[id].locked=false; saveKO(); render(); }
    };
  });

  // ── Penalty winner buttons ───────────────────────────────────
  document.querySelectorAll('.btn-pens[data-ko]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.ko, pens=btn.dataset.pens;
      if(!koResults[id]) koResults[id]={goalsA:'',goalsB:'',locked:false,pens:null};
      koResults[id].pens=pens;
      saveKO(); render();
    };
  });

}
